<!DOCTYPE html>
<html lang="zh-CN">
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SportLife - 注册</title> <style> *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Inter', sans-serif; background: #ffffff; min-height: 100vh; overflow-x: hidden; position: relative; } /* ===== 背景装饰 ===== */ .bg-decoration { position: fixed; top: 0; right: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; } .blob-1 { position: absolute; top: -80px; right: -60px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, rgba(34, 197, 94, 0.08) 50%, transparent 70%); border-radius: 50%; filter: blur(40px); animation: blobPulse 6s ease-in-out infinite; } .blob-2 { position: absolute; top: -20px; right: -120px; width: 180px; height: 180px; background: radial-gradient(circle, rgba(34, 197, 94, 0.18) 0%, rgba(16, 185, 129, 0.06) 60%, transparent 80%); border-radius: 50%; filter: blur(50px); animation: blobPulse 8s ease-in-out infinite 1s; } .blob-3 { position: absolute; top: 100px; right: -40px; width: 140px; height: 140px; background: radial-gradient(circle, rgba(74, 222, 128, 0.2) 0%, transparent 70%); border-radius: 50%; filter: blur(35px); animation: blobPulse 7s ease-in-out infinite 2s; } @keyframes blobPulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } } /* ===== 主容器 ===== */ .page-container { position: relative; z-index: 1; max-width: 375px; margin: 0 auto; padding: 36px 28px 32px; min-height: 100vh; display: flex; flex-direction: column; } /* ===== Logo 区域 ===== */ .logo-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; opacity: 0; transform: translateY(16px); animation: fadeSlideUp 0.6s ease forwards 0.1s; } .logo-circle { width: 60px; height: 60px; background: linear-gradient(135deg, #22C55E, #16A34A); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3); margin-bottom: 10px; } .logo-circle svg { width: 32px; height: 32px; fill: #ffffff; } .logo-text { font-size: 20px; font-weight: 800; color: #1a1a1a; letter-spacing: -0.3px; } /* ===== 欢迎文字 ===== */ .welcome-section { text-align: center; margin-bottom: 24px; opacity: 0; transform: translateY(16px); animation: fadeSlideUp 0.6s ease forwards 0.2s; } .welcome-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; } .welcome-subtitle { font-size: 13px; color: #888; font-weight: 400; } /* ===== 表单卡片 ===== */ .form-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(34, 197, 94, 0.1); border-radius: 20px; padding: 24px 20px; margin-bottom: 20px; opacity: 0; transform: translateY(16px); animation: fadeSlideUp 0.6s ease forwards 0.35s; box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); } /* ===== 输入框 ===== */ .input-group { position: relative; margin-bottom: 14px; } .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #aaa; pointer-events: none; transition: color 0.3s ease; } .input-field { width: 100%; height: 48px; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 0 14px 0 44px; font-size: 14px; font-family: 'Inter', sans-serif; color: #1a1a1a; background: #FFFFFF; outline: none; transition: all 0.25s ease; } .input-field::placeholder { color: #94A3B8; } .input-field:focus { border-color: #22C55E; background: #ffffff; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12); transform: translateY(-1px); } .input-field:focus ~ .input-icon { color: #22C55E; } /* 带单位后缀的输入框 */ .input-field.has-suffix { padding-right: 44px; } .input-suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #bbb; font-weight: 500; pointer-events: none; } /* ===== 密码可见性切换 ===== */ .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #aaa; transition: color 0.3s ease; display: flex; align-items: center; justify-content: center; } .toggle-password:hover { color: #22C55E; } .toggle-password svg { width: 20px; height: 20px; } /* ===== 性别选择器 ===== */ .gender-section { margin-bottom: 14px; } .gender-label { font-size: 13px; color: #666; font-weight: 500; margin-bottom: 8px; display: block; } .gender-pills { display: flex; gap: 10px; } .gender-pill { flex: 1; position: relative; } .gender-pill input[type="radio"] { display: none; } .gender-pill-btn { display: flex; align-items: center; justify-content: center; height: 42px; border: 1.5px solid #e5e5e5; border-radius: 10px; background: #fafafa; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 500; color: #888; cursor: pointer; transition: all 0.3s ease; user-select: none; } .gender-pill input[type="radio"]:checked ~ .gender-pill-btn { border-color: #22C55E; background: rgba(34, 197, 94, 0.08); color: #22C55E; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.1); } .gender-pill-btn:active { transform: scale(0.97); } /* ===== 身高体重行 ===== */ .measure-row { display: flex; gap: 12px; margin-bottom: 14px; } .measure-row .input-group { flex: 1; margin-bottom: 0; } /* ===== 协议复选框 ===== */ .agreement-row { margin-bottom: 20px; } .agreement-label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 12px; color: #888; line-height: 1.5; user-select: none; } .agreement-label input[type="checkbox"] { display: none; } .custom-checkbox { width: 18px; height: 18px; border: 1.5px solid #d0d0d0; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; margin-top: 1px; } .custom-checkbox svg { width: 12px; height: 12px; color: white; opacity: 0; transform: scale(0.5); transition: all 0.2s ease; } .agreement-label input[type="checkbox"]:checked ~ .custom-checkbox { background: #22C55E; border-color: #22C55E; } .agreement-label input[type="checkbox"]:checked ~ .custom-checkbox svg { opacity: 1; transform: scale(1); } .agreement-label a { color: #22C55E; text-decoration: none; font-weight: 500; } .agreement-label a:hover { text-decoration: underline; } /* ===== CTA 按钮 ===== */ .btn-primary { width: 100%; height: 48px; background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); border: none; border-radius: 12px; color: #ffffff; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 16px rgba(34, 197, 94, 0.25), 0 8px 32px rgba(34, 197, 94, 0.15); display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; } .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%); pointer-events: none; } .btn-primary:hover { background: linear-gradient(135deg, #16A34A, #15803D); box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35); transform: translateY(-1px); } .btn-primary:active { transform: translateY(0) scale(0.97); box-shadow: 0 2px 8px rgba(34, 197, 94, 0.2); } .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; } .btn-primary .spinner { display: none; width: 20px; height: 20px; border: 2.5px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.7s linear infinite; } .btn-primary.loading .spinner { display: block; } .btn-primary.loading .btn-text { display: none; } @keyframes spin { to { transform: rotate(360deg); } } /* ===== 底部链接 ===== */ .bottom-link { text-align: center; margin-top: auto; padding-top: 20px; opacity: 0; animation: fadeSlideUp 0.6s ease forwards 0.5s; } .bottom-link p { font-size: 14px; color: #888; } .bottom-link a { color: #22C55E; text-decoration: none; font-weight: 600; margin-left: 4px; transition: opacity 0.2s ease; } .bottom-link a:hover { opacity: 0.8; text-decoration: underline; } /* ===== Toast 通知 ===== */ .toast-container { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 9999; width: 100%; max-width: 375px; padding: 16px 20px 0; pointer-events: none; } .toast { background: #EF4444; color: #ffffff; padding: 14px 18px; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 500; box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3); transform: translateY(-100%); opacity: 0; transition: all 0.4s ease; pointer-events: auto; display: flex; align-items: center; gap: 10px; } .toast.show { transform: translateY(0); opacity: 1; } .toast.success { background: #22C55E; box-shadow: 0 8px 24px rgba(34, 197, 94, 0.3); } .toast svg { width: 20px; height: 20px; flex-shrink: 0; } /* ===== 动画 ===== */ @keyframes fadeSlideUp { to { opacity: 1; transform: translateY(0); } } /* Stagger animation for form elements */ .form-card .input-group:nth-child(1) { animation: fadeSlideUp 0.6s ease forwards 0.40s; opacity: 0; transform: translateY(16px); } .form-card .input-group:nth-child(2) { animation: fadeSlideUp 0.6s ease forwards 0.45s; opacity: 0; transform: translateY(16px); } .form-card .input-group:nth-child(3) { animation: fadeSlideUp 0.6s ease forwards 0.50s; opacity: 0; transform: translateY(16px); } .form-card .input-group:nth-child(4) { animation: fadeSlideUp 0.6s ease forwards 0.55s; opacity: 0; transform: translateY(16px); } .form-card .gender-section { animation: fadeSlideUp 0.6s ease forwards 0.60s; opacity: 0; transform: translateY(16px); } .form-card .measure-row { animation: fadeSlideUp 0.6s ease forwards 0.65s; opacity: 0; transform: translateY(16px); } .form-card .agreement-row { animation: fadeSlideUp 0.6s ease forwards 0.70s; opacity: 0; transform: translateY(16px); } .form-card .btn-primary { animation: fadeSlideUp 0.6s ease forwards 0.75s; opacity: 0; transform: translateY(16px); } /* ===== 响应式 ===== */ @media (max-width: 375px) { .page-container { padding: 28px 20px 24px; } .form-card { padding: 20px 16px; } } @media (min-width: 376px) { .page-container { padding-top: 48px; } } html.dark body { background: #0F172A; } html.dark .logo-text { color: #F8FAFC; } html.dark .welcome-title { color: #F8FAFC; } html.dark .welcome-subtitle { color: #94A3B8; } html.dark .form-card { background: rgba(30, 41, 59, 0.85); border-color: rgba(34, 197, 94, 0.15); } html.dark .input-field { background: #1E293B; border-color: #334155; color: #F8FAFC; } html.dark .input-field::placeholder { color: #64748B; } html.dark .input-field:focus { background: #334155; } html.dark .input-icon, html.dark .toggle-password { color: #64748B; } html.dark .checkbox-label { color: #94A3B8; } html.dark .custom-checkbox { border-color: #475569; } html.dark .divider { border-top-color: #334155; } html.dark .bottom-text { color: #94A3B8; } html.dark .form-options { color: #94A3B8; } </style> <script src="theme-init.js"></script> <script src="ngrok-fix.js"></script>

<body> <!-- 背景装饰 --> <div class="bg-decoration"> <div class="blob-1"></div> <div class="blob-2"></div> <div class="blob-3"></div> </div> <!-- Toast 容器 --> <div class="toast-container" id="toastContainer"> <div class="toast" id="toast"></div> </div> <!-- 主容器 --> <div class="page-container"> <!-- Logo 区域 --> <div class="logo-area"> <div class="logo-circle"> <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"> <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/> </svg> </div> <span class="logo-text">SportLife</span> </div> <!-- 欢迎文字 --> <div class="welcome-section"> <h1 class="welcome-title">创建账号</h1> <p class="welcome-subtitle">开始你的健身旅程</p> </div> <!-- 表单卡片 --> <div class="form-card"> <form id="registerForm" novalidate> <!-- 用户名 --> <div class="input-group"> <input type="text" class="input-field" id="username" placeholder="请输入用户名" autocomplete="username" required> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/> <circle cx="12" cy="7" r="4"/> </svg> </div> <!-- 昵称 --> <div class="input-group"> <input type="text" class="input-field" id="nickname" placeholder="请输入昵称（选填）" autocomplete="nickname"> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="10"/> <path d="M8 14s1.5 2 4 2 4-2 4-2"/> <line x1="9" y1="9" x2="9.01" y2="9"/> <line x1="15" y1="9" x2="15.01" y2="9"/> </svg> </div> <!-- 密码 --> <div class="input-group"> <input type="password" class="input-field" id="password" placeholder="请输入密码（至少6位）" autocomplete="new-password" required> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/> <path d="M7 11V7a5 5 0 0 1 10 0v4"/> </svg> <button type="button" class="toggle-password" data-target="password" aria-label="切换密码可见性"> <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/> <circle cx="12" cy="12" r="3"/> </svg> </button> </div> <!-- 确认密码 --> <div class="input-group"> <input type="password" class="input-field" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/> </svg> <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="切换密码可见性"> <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/> <circle cx="12" cy="12" r="3"/> </svg> </button> </div> <!-- 性别选择 --> <div class="gender-section"> <label class="gender-label">性别</label> <div class="gender-pills"> <div class="gender-pill"> <input type="radio" name="gender" value="男" id="gender-male"> <label class="gender-pill-btn" for="gender-male">男</label> </div> <div class="gender-pill"> <input type="radio" name="gender" value="女" id="gender-female"> <label class="gender-pill-btn" for="gender-female">女</label> </div> <div class="gender-pill"> <input type="radio" name="gender" value="保密" id="gender-secret" checked> <label class="gender-pill-btn" for="gender-secret">保密</label> </div> </div> </div> <!-- 身高 & 体重 --> <div class="measure-row"> <div class="input-group"> <input type="number" class="input-field has-suffix" id="height" placeholder="身高" min="50" max="250"> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M18 20V10"/> <path d="M12 20V4"/> <path d="M6 20v-6"/> </svg> <span class="input-suffix">cm</span> </div> <div class="input-group"> <input type="number" class="input-field has-suffix" id="weight" placeholder="体重" min="20" max="300"> <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="10"/> <path d="M8 12a4 4 0 1 1 8 0"/> <line x1="12" y1="8" x2="12" y2="12"/> <line x1="12" y1="12" x2="14" y2="12"/> </svg> <span class="input-suffix">kg</span> </div> </div> <!-- 用户协议 --> <div class="agreement-row"> <label class="agreement-label"> <input type="checkbox" id="agreement"> <span class="custom-checkbox"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"> <polyline points="20 6 9 17 4 12"/> </svg> </span> <span>注册即同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a></span> </label> </div> <!-- 注册按钮 --> <button type="submit" class="btn-primary" id="registerBtn"> <span class="btn-text">注册</span> <div class="spinner"></div> </button> </form> </div> <!-- 底部链接 --> <div class="bottom-link"> <p>已有账号？<a href="login.html">立即登录</a></p> </div> </div> <script>
const API_BASE = '/api';

// ===== DOM 元素 =====
const registerForm = document.getElementById('registerForm');
const usernameInput = document.getElementById('username');
const nicknameInput = document.getElementById('nickname');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const registerBtn = document.getElementById('registerBtn');
const toast = document.getElementById('toast');

// ===== 密码可见性切换 =====
document.querySelectorAll('.toggle-password').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var targetId = this.getAttribute('data-target');
    var input = document.getElementById(targetId);
    var eyeIcon = this.querySelector('.eye-icon');
    var isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    if (isPassword) {
      eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  });
});

// ===== Toast 通知 =====
function showToast(message, type) {
  toast.className = 'toast';
  toast.classList.add(type || 'error');
  var iconSvg = type === 'success'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  toast.innerHTML = iconSvg + '<span>' + message + '</span>';
  requestAnimationFrame(function () {
    toast.classList.add('show');
  });
  setTimeout(function () {
    toast.classList.remove('show');
  }, 3000);
}

// ===== 获取性别值 =====
function getSelectedGender() {
  var selected = document.querySelector('input[name="gender"]:checked');
  return selected ? selected.value : '保密';
}

// ===== 表单提交 =====
registerForm.addEventListener('submit', function (e) {
  e.preventDefault();

  var username = usernameInput.value.trim();
  var nickname = nicknameInput.value.trim();
  var password = passwordInput.value;
  var confirmPassword = confirmPasswordInput.value;
  var gender = getSelectedGender();
  var height = document.getElementById('height').value;
  var weight = document.getElementById('weight').value;

  // 验证
  if (!username) {
    showToast('请输入用户名', 'error');
    usernameInput.focus();
    return;
  }
  if (password.length < 6) {
    showToast('密码长度不能少于6位', 'error');
    passwordInput.focus();
    return;
  }
  if (password !== confirmPassword) {
    showToast('两次输入的密码不一致', 'error');
    confirmPasswordInput.focus();
    return;
  }

  // 加载状态
  registerBtn.classList.add('loading');
  registerBtn.disabled = true;

  var body = {
    username: username,
    password: password,
    gender: gender
  };
  if (nickname) { body.nickname = nickname; }
  if (height) { body.height = Number(height); }
  if (weight) { body.weight = Number(weight); }

  fetch(API_BASE + '/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (response) {
    return response.json();
  }).then(function (data) {
    if (data.success) {
      showToast('注册成功！即将进入...', 'success');
      var user = data.user;
      localStorage.setItem('sportlife_user', JSON.stringify(user));
      var sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('sportlife_session_id', sessionId);
      fetch(API_BASE + '/session/force-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user.id, sessionId: sessionId, deviceInfo: navigator.userAgent.substring(0, 120) })
      }).catch(function () {});
      setTimeout(function () {
        navigateTo('home.html');
      }, 1200);
    } else {
      showToast(data.message || '注册失败，请稍后重试', 'error');
    }
  }).catch(function (err) {
    showToast('网络错误，请检查网络连接', 'error');
  }).finally(function () {
    registerBtn.classList.remove('loading');
    registerBtn.disabled = false;
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(reg) { reg.unregister(); });
  });
}
</script></body>
