    var s = data.summary || data.week_total || {};
    var workouts = s.total_workouts || s.workouts || 0;
    var calories = s.total_calories || s.calories || 0;
    var distance = s.total_distance || s.distance || 0;
    var duration = s.total_duration || s.durationMinutes || 0;

    document.getElementById('stat-workouts').textContent = workouts;
    document.getElementById('stat-calories').textContent = calories.toLocaleString();
    document.getElementById('stat-distance').textContent = parseFloat(distance).toFixed(1);
    document.getElementById('stat-duration').textContent = formatDuration(duration);

    setTrend('trend-workouts', s.workoutsTrend || 0);
    setTrend('trend-calories', s.caloriesTrend || 0);
    setTrend('trend-distance', s.distanceTrend || 0);
    setTrend('trend-duration', s.durationTrend || 0);

    var weekLabel = data.weekLabel || '';
    if (!weekLabel) {
      var now = new Date();
      var from = new Date(now.getTime() - 6 * 86400000);
      weekLabel = (from.getMonth() + 1) + '/' + from.getDate() + ' - ' + (now.getMonth() + 1) + '/' + now.getDate();
    }
    document.getElementById('week-range').textContent = weekLabel;
  }

  function setTrend(id, val) {
    var el = document.getElementById(id);
    if (!el || val === 0) return;
    el.style.display = 'flex';
    var isUp = val > 0;
    var svg = el.querySelector('svg');
    var span = el.querySelector('span');
    if (isUp) {
      el.classList.remove('summary-trend--down');
      svg.innerHTML = '<path d="M12 4l8 12H4z"/>';
      span.textContent = '+' + Math.abs(val) + '%';
    } else {
      el.classList.add('summary-trend--down');
      svg.innerHTML = '<path d="M20 18L12 6l-8 12z"/>';
      span.textContent = '-' + Math.abs(val) + '%';
    }
  }

  function renderLevel(data) {
    if (!data) return;
    data.level = data.level || 1;
    data.title = data.title || '新手';
    data.currentXp = data.currentXp || 0;
    data.nextLevelXp = data.nextLevelXp || 100;
    data.totalXp = data.totalXp || 0;
    data.streakDays = data.streakDays || 0;
    document.getElementById('level-badge').textContent = data.level;
    document.getElementById('level-title').textContent = 'Lv.' + data.level + ' ' + data.title;
    document.getElementById('level-subtitle').textContent = '\u8DDD\u79BB\u4E0B\u4E00\u7EA7\u8FD8\u9700 ' + (data.nextLevelXp - data.currentXp) + ' XP';
    document.getElementById('xp-progress-text').textContent = data.currentXp + ' / ' + data.nextLevelXp + ' XP';
    document.getElementById('total-xp').textContent = (data.totalXp || 0).toLocaleString();
    document.getElementById('streak-days').textContent = data.streakDays;
    var pct = Math.min(100, (data.currentXp / data.nextLevelXp) * 100);
    setTimeout(function() {
      document.getElementById('xp-bar-fill').style.width = pct + '%';
    }, 300);
  }

  function drawBarChart(data) {
    var canvas = document.getElementById('barChart');
    var wrap = canvas.parentElement;
    var w = wrap.clientWidth;
    var h = 200;
    var ctx = setupHiDPICanvas(canvas, w, h);
    var daily = data.daily;
    var maxVal = Math.max.apply(null, daily.map(function(d) { return d.duration; }));
    if (maxVal === 0) maxVal = 60;
    maxVal = Math.ceil(maxVal / 15) * 15;
    var padLeft = 36, padRight = 12, padTop = 10, padBottom = 28;
    var chartW = w - padLeft - padRight;
    var chartH = h - padTop - padBottom;
    var barCount = daily.length;
    var gap = 10;
    var barW = Math.max(8, (chartW - gap * (barCount + 1)) / barCount);
    var totalBarsW = barW * barCount + gap * (barCount - 1);
    var offsetX = padLeft + (chartW - totalBarsW) / 2;
    var textTertiary = getCSS('--sf-text-tertiary') || '#94A3B8';
    var borderLight = getCSS('--sf-border-light') || '#E2E8F0';
    var bgTertiary = getCSS('--sf-bg-tertiary') || '#F1F5F9';
    var barRects = [];

    function draw(progress) {
      ctx.clearRect(0, 0, w, h);
      barRects = [];
      var gridCount = 4;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (var g = 0; g <= gridCount; g++) {
        var yVal = (maxVal / gridCount) * g;
        var yPos = padTop + chartH - (chartH * (g / gridCount));
        ctx.strokeStyle = borderLight;
        ctx.lineWidth = 0.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(padLeft, yPos);
        ctx.lineTo(w - padRight, yPos);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = textTertiary;
        ctx.fillText(Math.round(yVal) + '', padLeft - 6, yPos);
      }
      var easedP = easeOutCubic(Math.min(1, progress));
      for (var i = 0; i < barCount; i++) {
        var x = offsetX + i * (barW + gap);
        var val = daily[i].duration;
        var barH = (val / maxVal) * chartH * easedP;
        var y = padTop + chartH - barH;
        barRects.push({ x: x, y: y, w: barW, h: barH, index: i });
        if (val > 0) {
          var grad = ctx.createLinearGradient(x, padTop + chartH, x, y);
          grad.addColorStop(0, '#16A34A');
          grad.addColorStop(1, '#4ADE80');
          ctx.fillStyle = grad;
          var r = Math.min(6, barW / 2);
          if (barH > r) {
            ctx.beginPath();
            ctx.moveTo(x, padTop + chartH);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.lineTo(x + barW - r, y);
            ctx.arcTo(x + barW, y, x + barW, y + r, r);
            ctx.lineTo(x + barW, padTop + chartH);
            ctx.closePath();
            ctx.fill();
          } else { ctx.fillRect(x, y, barW, Math.max(2, barH)); }
        } else {
          ctx.fillStyle = bgTertiary;
          roundRect(ctx, x, padTop + chartH - 4, barW, 4, Math.min(4, barW / 2));
          ctx.fill();
        }
        ctx.fillStyle = textTertiary;
        ctx.font = '11px Inter, PingFang SC, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(daily[i].day, x + barW / 2, padTop + chartH + 8);
      }
    }
    var animStart = null;
    function animate(ts) {
      if (!animStart) animStart = ts;
      var progress = Math.min(1, (ts - animStart) / 900);
      draw(progress);
      if (progress < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    var tooltip = document.getElementById('barTooltip');
    function showTip(idx) {
      tooltip.innerHTML = daily[idx].day + ' \u00B7 ' + daily[idx].duration + ' \u5206\u949F';
      tooltip.classList.add('show');
      var r = barRects[idx];
      tooltip.style.left = (r.x + r.w / 2) + 'px';
      tooltip.style.top = r.y + 'px';
      tooltip.style.transform = 'translate(-50%, -100%)';
    }
    function hideTip() { tooltip.classList.remove('show'); }
    function getIdx(cx, cy) {
      var cr = canvas.getBoundingClientRect();
      var x = (cx - cr.left) * (w / cr.width);
      var y = (cy - cr.top) * (h / cr.height);
      for (var i = 0; i < barRects.length; i++) {
        var r = barRects[i];
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h + 10) return i;
      }
      return -1;
    }
    canvas.addEventListener('mousemove', function(e) { var i = getIdx(e.clientX, e.clientY); if (i >= 0) showTip(i); else hideTip(); });
    canvas.addEventListener('mouseleave', hideTip);
    canvas.addEventListener('touchstart', function(e) { var t = e.touches[0]; var i = getIdx(t.clientX, t.clientY); if (i >= 0) { showTip(i); e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchend', function() { setTimeout(hideTip, 1200); });
  }

  function drawLineChart(data) {
    var canvas = document.getElementById('lineChart');
    var wrap = canvas.parentElement;
    var w = wrap.clientWidth;
    var h = 200;
    var ctx = setupHiDPICanvas(canvas, w, h);
    var daily = data.daily;
    var maxVal = Math.max.apply(null, daily.map(function(d) { return d.calories; }));
    if (maxVal === 0) maxVal = 500;
    maxVal = Math.ceil(maxVal / 100) * 100;
    var padLeft = 44, padRight = 12, padTop = 16, padBottom = 28;
    var chartW = w - padLeft - padRight;
    var chartH = h - padTop - padBottom;
    var textTertiary = getCSS('--sf-text-tertiary') || '#94A3B8';
    var borderLight = getCSS('--sf-border-light') || '#E2E8F0';
    var points = [];
    for (var i = 0; i < daily.length; i++) {
      points.push({ x: padLeft + (chartW / (daily.length - 1)) * i, y: padTop + chartH - (daily[i].calories / maxVal) * chartH, data: daily[i] });
    }
    var animStart = null;
    function draw(progress) {
      ctx.clearRect(0, 0, w, h);
      var easedP = easeOutQuart(Math.min(1, progress));
      var gridCount = 4;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (var g = 0; g <= gridCount; g++) {
        var yVal = (maxVal / gridCount) * g;
        var yPos = padTop + chartH - (chartH * (g / gridCount));
        ctx.strokeStyle = borderLight;
        ctx.lineWidth = 0.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(padLeft, yPos);
        ctx.lineTo(w - padRight, yPos);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = textTertiary;
        ctx.fillText(Math.round(yVal) + '', padLeft - 6, yPos);
      }
      var totalLen = points.length - 1;
      var visibleCount = Math.floor(easedP * totalLen);
      var partialFrac = (easedP * totalLen) - visibleCount;
      var visible = [];
      for (var vi = 0; vi <= visibleCount && vi < points.length; vi++) { visible.push(points[vi]); }
      if (visibleCount < totalLen && partialFrac > 0) {
        var from = points[visibleCount], to = points[visibleCount + 1];
        visible.push({ x: from.x + (to.x - from.x) * partialFrac, y: from.y + (to.y - from.y) * partialFrac, data: to.data });
      }
      if (visible.length < 2) return;
      var grad = ctx.createLinearGradient(0, padTop, 0, padTop + chartH);
      grad.addColorStop(0, 'rgba(249,115,22,0.25)');
      grad.addColorStop(1, 'rgba(249,115,22,0.01)');
      ctx.beginPath();
      ctx.moveTo(visible[0].x, padTop + chartH);
      for (var li = 0; li < visible.length; li++) {
        if (li === 0) { ctx.lineTo(visible[li].x, visible[li].y); }
        else { var p = visible[li - 1], c = visible[li]; var cpx = (p.x + c.x) / 2; ctx.bezierCurveTo(cpx, p.y, cpx, c.y, c.x, c.y); }
      }
      ctx.lineTo(visible[visible.length - 1].x, padTop + chartH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.beginPath();
      for (var li2 = 0; li2 < visible.length; li2++) {
        if (li2 === 0) { ctx.moveTo(visible[li2].x, visible[li2].y); }
        else { var p2 = visible[li2 - 1], c2 = visible[li2]; var cpx2 = (p2.x + c2.x) / 2; ctx.bezierCurveTo(cpx2, p2.y, cpx2, c2.y, c2.x, c2.y); }
      }
      ctx.strokeStyle = '#F97316';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      for (var di = 0; di <= visibleCount && di < points.length; di++) {
        ctx.beginPath(); ctx.arc(points[di].x, points[di].y, 4, 0, Math.PI * 2); ctx.fillStyle = '#F97316'; ctx.fill();
        ctx.beginPath(); ctx.arc(points[di].x, points[di].y, 2, 0, Math.PI * 2); ctx.fillStyle = getCSS('--sf-bg-elevated') || '#FFFFFF'; ctx.fill();
      }
      ctx.fillStyle = textTertiary;
      ctx.font = '11px Inter, PingFang SC, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (var xi = 0; xi < daily.length; xi++) { ctx.fillText(daily[xi].day, padLeft + (chartW / (daily.length - 1)) * xi, padTop + chartH + 8); }
    }
    function animate(ts) {
      if (!animStart) animStart = ts;
      var progress = Math.min(1, (ts - animStart) / 1200);
      draw(progress);
      if (progress < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    var tooltip = document.getElementById('lineTooltip');
    function getIdx(cx) {
      var cr = canvas.getBoundingClientRect();
      var x = (cx - cr.left) * (w / cr.width);
      var best = -1, bestD = Infinity;
      for (var pi = 0; pi < points.length; pi++) { var d = Math.abs(x - points[pi].x); if (d < bestD && d < 30) { bestD = d; best = pi; } }
      return best;
    }
    function showTip(idx) {
      var p = points[idx];
      tooltip.innerHTML = p.data.day + ' \u00B7 ' + p.data.calories + ' kcal';
      tooltip.classList.add('show');
      tooltip.style.left = p.x + 'px';
      tooltip.style.top = p.y + 'px';
      tooltip.style.transform = 'translate(-50%, -130%)';
    }
    function hideTip() { tooltip.classList.remove('show'); }
    canvas.addEventListener('mousemove', function(e) { var i = getIdx(e.clientX); if (i >= 0) showTip(i); else hideTip(); });
    canvas.addEventListener('mouseleave', hideTip);
    canvas.addEventListener('touchstart', function(e) { var t = e.touches[0]; var i = getIdx(t.clientX); if (i >= 0) { showTip(i); e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchend', function() { setTimeout(hideTip, 1200); });
  }

  function drawDonutChart(data) {
    var canvas = document.getElementById('donutChart');
    var size = 220;
    var ctx = setupHiDPICanvas(canvas, size, size);
    var types = data.types;
    var total = types.reduce(function(s, t) { return s + t.count; }, 0);
    var cx = size / 2, cy = size / 2;
    var outerR = size / 2 - 8;
    var innerR = outerR * 0.6;
    var animStart = null;
    function draw(progress) {
      ctx.clearRect(0, 0, size, size);
      var easedP = easeOutCubic(Math.min(1, progress));
      var maxAngle = Math.PI * 2 * easedP;
      var startAngle = -Math.PI / 2;
      var drawnAngle = 0;
      for (var i = 0; i < types.length; i++) {
        var sliceAngle = (types[i].count / total) * Math.PI * 2;
        var drawSlice = Math.min(sliceAngle, maxAngle - drawnAngle);
        if (drawSlice <= 0) break;
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, startAngle, startAngle + drawSlice);
        ctx.arc(cx, cy, innerR, startAngle + drawSlice, startAngle, true);
        ctx.closePath();
        ctx.fillStyle = types[i].color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = getCSS('--sf-bg-elevated') || '#FFFFFF';
        ctx.stroke();
        startAngle += sliceAngle;
        drawnAngle += sliceAngle;
      }
      if (easedP > 0.5) {
        var textAlpha = Math.min(1, (easedP - 0.5) * 4);
        ctx.globalAlpha = textAlpha;
        ctx.fillStyle = getCSS('--sf-text-primary') || '#0F172A';
        ctx.font = '800 32px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(total + '', cx, cy - 6);
        ctx.font = '500 12px Inter, PingFang SC, sans-serif';
        ctx.fillStyle = getCSS('--sf-text-tertiary') || '#94A3B8';
        ctx.fillText('\u6B21\u8FD0\u52A8', cx, cy + 16);
        ctx.globalAlpha = 1;
      }
    }
    function animate(ts) {
      if (!animStart) animStart = ts;
      var progress = Math.min(1, (ts - animStart) / 1100);
      draw(progress);
      if (progress < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    var legendEl = document.getElementById('donutLegend');
    legendEl.innerHTML = '';
    types.forEach(function(t) {
      var item = document.createElement('div');
      item.className = 'donut-legend-item';
      item.innerHTML = '<span class="donut-legend-dot" style="background:' + t.color + '"></span><span>' + t.name + ' ' + t.count + '\u6B21</span>';
      legendEl.appendChild(item);
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  async function fetchStats() {
    if (!user) return;
    try {
      var res = await fetch('/api/stats/' + user.id + '/weekly');
      var json = await res.json();
      statsData = (json.success && json.days) ? json : DEMO_STATS;
    } catch (err) { statsData = DEMO_STATS; }
    renderSummary(statsData);
  }

  async function fetchXP() {
    if (!user) return;
    try {
      var res = await fetch('/api/xp/' + user.id);
      var json = await res.json();
      xpData = (json.success && json.level !== undefined) ? json : DEMO_XP;
    } catch (err) { xpData = DEMO_XP; }
    renderLevel(xpData);
  }

  function observeCharts() {
    [
      { id: 'bar-section', draw: function() { drawBarChart(statsData); } },
      { id: 'line-section', draw: function() { drawLineChart(statsData); } },
      { id: 'donut-section', draw: function() { drawDonutChart(statsData); } }
    ].forEach(function(item) {
      var el = document.getElementById(item.id);
      if (!el) return;
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting && statsData) { item.draw(); observer.unobserve(entry.target); }
        });
      }, { threshold: 0.25 });
      observer.observe(el);
    });
  }

  document.addEventListener('DOMContentLoaded', async function() {
    await Promise.all([fetchStats(), fetchXP()]);
    if (statsData) observeCharts();
  });

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (statsData) { drawBarChart(statsData); drawLineChart(statsData); drawDonutChart(statsData); }
    }, 250);
  });

})();
