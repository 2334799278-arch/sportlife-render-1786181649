el">训练</span> </a> <a href="course-detail.html" class="tab-item" style="text-decoration:none;"> <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/> <line x1="8" y1="21" x2="16" y2="21"/> <line x1="12" y1="17" x2="12" y2="21"/> </svg> <span class="tab-label">课程</span> </a> <a href="community.html" class="tab-item" style="text-decoration:none;"> <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/> <circle cx="9" cy="7" r="4"/> <path d="M23 21v-2a4 4 0 0 0-3-3.87"/> <path d="M16 3.13a4 4 0 0 1 0 7.75"/> </svg> <span class="tab-label">社区</span> </a> <a href="profile.html" class="tab-item active" style="text-decoration:none;"> <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/> <circle cx="12" cy="7" r="4"/> </svg> <span class="tab-label">我的</span> </a> </nav> <!-- ===== JAVASCRIPT ===== --> <script>
(function() { 'use strict';

  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem('sportlife_user')); }
    catch (e) { return null; }
  }
  if (!getCurrentUser()) { navigateTo('login.html'); }
  var user = getCurrentUser();

  /* ---- System Badge Definitions ---- */
  var SYSTEM_BADGES = [
    { id: 'running_expert', name: '\u8DD1\u6B65\u8FBE\u4EBA', emoji: '\uD83C\uDFC3', gradient: 'badge-circle--green' },
    { id: '7day_streak', name: '\u8FDE\u7EED7\u5929', emoji: '\uD83D\uDD25', gradient: 'badge-circle--orange' },
    { id: 'strength_star', name: '\u529B\u91CF\u4E4B\u661F', emoji: '\uD83D\uDCAA', gradient: 'badge-circle--blue' },
    { id: 'yoga_beginner', name: '\u745C\u4F3D\u65B0\u624B', emoji: '\uD83E\uDDD8', gradient: 'badge-circle--purple' },
    { id: '100day_commit', name: '\u767E\u65E5\u575A\u6301', emoji: '\u2B50', gradient: 'badge-circle--gold' },
    { id: '10k_steps', name: '\u4E07\u6B65\u8FBE\u4EBA', emoji: '\uD83C\uDFC5', gradient: 'badge-circle--green-blue' },
    { id: 'half_marathon', name: '\u534A\u7A0B\u9A6C\u62C9\u677E', emoji: '\uD83C\uDFC3\u200D\u2640\uFE0F', gradient: 'badge-circle--orange-red' }
  ];

  /* ---- Init ---- */
  document.addEventListener('DOMContentLoaded', function() {
    loadData();
  });

  /* ---- Load All Data ---- */
  async function loadData() {
    try {
      var stepsRes = await fetch('/api/steps/' + user.id);
      var workoutsRes = await fetch('/api/workouts/' + user.id + '/today');
      var statsRes = await fetch('/api/workouts/' + user.id + '/stats');
      var weekRes = await fetch('/api/steps/' + user.id + '/week');
      var achRes = await fetch('/api/achievements/' + user.id);

      var stepsData = await stepsRes.json();
      var workoutsData = await workoutsRes.json();
      var statsData = await statsRes.json();
      var weekData = await weekRes.json();
      var achData = await achRes.json();

      var steps = (stepsData.success) ? (stepsData.steps || 0) : 0;
      var workouts = (workoutsData.success) ? (workoutsData.workouts || []) : [];
      var stats = (statsData.success) ? (statsData.stats || {}) : {};
      var week = (weekData.success) ? (weekData.records || []) : [];
      var earned = (achData.success && achData.earned) ? achData.earned : [];

      /* totals for rings */
      var totalMin = workouts.reduce(function(sum, w) { return sum + (w.duration_minutes || 0); }, 0);
      var totalCal = workouts.reduce(function(sum, w) { return sum + (w.calories_burned || 0); }, 0) + Math.round(steps * 0.04);

      /* rings */
      animateRing('ring-move', 596.9, totalCal / 500);
      animateRing('ring-exercise', 502.6, totalMin / 30);
      animateRing('ring-stand', 408.4, steps > 100 ? 1 : steps / 100);

      /* ring labels */
      document.getElementById('move-label').textContent = Math.round(totalCal) + '/500 \u5343\u5361';
      document.getElementById('exercise-label').textContent = totalMin + '/30 \u5206\u949F';
      document.getElementById('stand-label').textContent = (steps > 100 ? '1' : '0') + '/12 \u5C0F\u65F6';

      /* chart */
      renderWeeklyChart(week);

      /* badges */
      renderAchievements(earned);

      /* records */
      document.getElementById('pr-distance').textContent = stats.totalDistance ? stats.totalDistance + ' km' : '--';
      document.getElementById('pr-steps').textContent = stats.totalSteps ? stats.totalSteps.toLocaleString() : '--';
      document.getElementById('pr-duration').textContent = stats.totalDurationMin ? Math.round(stats.totalDurationMin / 60) + ' \u5C0F\u65F6' : '--';
      document.getElementById('pr-calories').textContent = stats.totalCalories ? stats.totalCalories.toLocaleString() + ' \u5343\u5361' : '--';
    } catch (e) {
      console.error('Failed to load data:', e);
      /* render locked badges as fallback */
      renderAchievements([]);
    }
  }

  /* ---- Animate Activity Ring ---- */
  function animateRing(id, circumference, progress) {
    setTimeout(function() {
      var el = document.getElementById(id);
      if (!el) return;
      var offset = circumference - (circumference * Math.min(progress, 1));
      el.style.transition = 'stroke-dashoffset 1.5s ease-out';
      el.style.strokeDashoffset = offset;
    }, 300);
  }

  /* ---- Render Weekly Chart ---- */
  function renderWeeklyChart(records) {
    var container = document.getElementById('weekly-chart');
    var days = ['\u5468\u4E00', '\u5468\u4E8C', '\u5468\u4E09', '\u5468\u56DB', '\u5468\u4E94', '\u5468\u516D', '\u5468\u65E5'];
    var todayIndex = (new Date().getDay() + 6) % 7;

    /* build a map of steps by day index */
    var daySteps = {};
    if (records && records.length > 0) {
      records.forEach(function(r) {
        if (r.date) {
          var d = new Date(r.date);
          var idx = (d.getDay() + 6) % 7;
          daySteps[idx] = (daySteps[idx] || 0) + (r.steps || 0);
        }
      });
    }

    var maxSteps = 10000;

    var html = '';
    for (var i = 0; i < 7; i++) {
      var steps = daySteps[i] || 0;
      var heightPct = Math.max(steps / maxSteps, 0.05);
      var heightPx = Math.round(heightPct * 100) + 6;
      var colorClass = steps >= 5000 ? 'weekly-bar--green' : (steps >= 2000 ? 'weekly-bar--orange' : 'weekly-bar--gray');
      var isToday = (i === todayIndex) ? ' today' : '';
      html += '<div class="weekly-bar-wrapper">' +
        '<div class="weekly-bar ' + colorClass + '" style="height: ' + heightPx + 'px;"></div>' +
        '<span class="weekly-day-label' + isToday + '">' + days[i] + '</span>' +
        '</div>';
    }
    container.innerHTML = html;
  }

  /* ---- Render Achievements ---- */
  function renderAchievements(earnedBadges) {
    var earnedContainer = document.getElementById('badges-earned');
    var lockedContainer = document.getElementById('badges-locked');
    var earnedCountEl = document.getElementById('earned-count');
    var lockedCountEl = document.getElementById('locked-count');

    /* build a set of earned badge IDs */
    var earnedIds = {};
    if (earnedBadges && earnedBadges.length > 0) {
      earnedBadges.forEach(function(b) {
        earnedIds[b.id || b.achievement_id || b.name] = true;
      });
    }

    var earnedHtml = '';
    var lockedHtml = '';
    var earnedCount = 0;
    var lockedCount = 0;

    SYSTEM_BADGES.forEach(function(badge) {
      var isEarned = earnedIds[badge.id] || earnedIds[badge.name];
      if (isEarned) {
        earnedCount++;
        earnedHtml += '<div class="badge-item">' +
          '<div class="badge-circle ' + badge.gradient + ' badge-circle--earned">' + badge.emoji + '</div>' +
          '<span class="badge-name">' + badge.name + '</span>' +
          '</div>';
      } else {
        lockedCount++;
        lockedHtml += '<div class="badge-item">' +
          '<div class="badge-circle badge-circle--locked">' + badge.emoji + '</div>' +
          '<span class="badge-name badge-name--locked">' + badge.name + '</span>' +
          '</div>';
      }
    });

    /* earned */
    if (earnedCount > 0) {
      earnedContainer.innerHTML = earnedHtml;
    } else {
      earnedContainer.innerHTML = '<div class="empty-badges" style="grid-column: 1 / -1;">' +
        '<div class="empty-badges-icon">\uD83C\uDFC6</div>' +
        '<p>\u8FD8\u6CA1\u6709\u83B7\u5F97\u6210\u5C31\uFF0C\u7EE7\u7EED\u52A0\u6CB9\uFF01</p>' +
        '</div>';
    }

    /* locked */
    if (lockedCount > 0) {
      lockedContainer.innerHTML = lockedHtml;
    } else {
      document.getElementById('locked-section').style.display = 'none';
    }

    /* counts */
    earnedCountEl.textContent = earnedCount;
    lockedCountEl.textContent = lockedCount;
  }

})();

/* ====== 单点登录：被踢下线检测 ====== */
(function() {
  function checkKicked() {
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    var sid = localStorage.getItem('sportlife_session_id') || '';
    if (!user.id || !sid) return;
    fetch('/api/session/kicked/' + user.id + '/' + sid).then(function(r){return r.json();}).then(function(data) {
      if (data.kicked) {
        localStorage.removeItem('sportlife_user');
        localStorage.removeItem('sportlife_session_id');
        // 显示被踢提示
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center';
        overlay.innerHTML = '<div style="background:white;border-radius:20px;padding:32px 24px;width:300px;max-width:85vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="10"/></svg></div>' +
          '<h3 style="font-size:17px;font-weight:600;color:#1E293B;margin:0 0 8px">账号已在其他设备登录</h3>' +
          '<p style="font-size:14px;color:#64748B;line-height:1.6;margin:0 0 24px">你的账号在其他设备上登录了，当前设备已下线。</p>' +
          '<button onclick="this.closest(\'div\').parentElement.remove();window.location.href=\'login.html\'" style="width:100%;padding:12px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,#22C55E,#16A34A);color:white;box-shadow:0 4px 12px rgba(34,197,94,0.3)">重新登录</button></div>';
        document.body.appendChild(overlay);
      }
    }).catch(function(){});
  }
  // 每 15 秒检测一次
  setTimeout(function() { checkKicked(); setInterval(checkKicked, 15000); }, 5000);
})();

  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(err) { console.log('SW register fail:', err); });
  });
}
</script></body>
