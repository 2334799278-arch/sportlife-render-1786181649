 #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 8px 32px rgba(34,197,94,0.3), inset 0 1px 0 rgba(255,255,255,0.25); transition: all var(--sf-transition-normal); -webkit-tap-highlight-color: transparent; overflow: hidden; z-index: 1; } .checkin-btn:active { transform: scale(0.95); } .checkin-btn.checked-in { background: linear-gradient(135deg, #16A34A 0%, #22C55E 100%); box-shadow: 0 4px 16px rgba(34,197,94,0.2); } .checkin-btn .btn-icon { font-size: 36px; line-height: 1; transition: transform 0.3s ease; } .checkin-btn.checked-in .btn-icon { transform: scale(1.1); } .checkin-btn .btn-label { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; } .checkin-btn .btn-xp { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: var(--sf-radius-full); } .checkin-streak { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--sf-text-secondary); margin-top: 4px; } .checkin-streak .streak-num { color: var(--sf-primary); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; } /* Check-in pulse animation */ @keyframes checkinPulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); } 70% { box-shadow: 0 0 0 20px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } } .checkin-btn.pulse { animation: checkinPulse 0.8s ease-out; } /* Ring shimmer on check-in */ @keyframes ringShimmer { 0% { stroke-dashoffset: 408; opacity: 0.6; } 50% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } } /* ============ CHALLENGE CARDS ============ */ .section-card { margin: 0 20px 16px; padding: 20px; border-radius: var(--sf-radius-xl); background: var(--sf-bg-elevated); box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04); transition: box-shadow 0.3s ease; } .section-title { font-size: 16px; font-weight: 700; color: var(--sf-text-primary); fo "/></svg> <span class="tab-label">挑战</span> </a> <a href="community.html" class="tab-item" style="text-decoration:none;"> <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span class="tab-label">社区</span> </a> <a href="profile.html" class="tab-item" style="text-decoration:none;"> <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> <span class="tab-label">我的</span> </a> </nav> <!-- ===== TOAST ELEMENT ===== --> <div class="toast" id="toast"></div> <!-- ===== JAVASCRIPT ===== --> <script>
(function() { 'use strict';

  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem('sportlife_user')); }
    catch (e) { return null; }
  }
  if (!getCurrentUser()) { navigateTo('login.html'); }
  var user = getCurrentUser();
  var isCheckedIn = false;

  /* ---- Init ---- */
  document.addEventListener('DOMContentLoaded', function() {
    loadCheckinStatus();
    loadChallenges();
    loadHeatmap();
    bindCheckinButton();
  });

  /* ---- Toast ---- */
  function showToast(message, type) {
    type = type || 'info';
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type;
    requestAnimationFrame(function() {
      toast.classList.add('show');
    });
    setTimeout(function() {
      toast.classList.remove('show');
    }, 2500);
  }

  /* ---- Confetti ---- */
  function launchConfetti() {
    var colors = ['#22C55E', '#F97316', '#38BDF8', '#A78BFA', '#F59E0B', '#EF4444', '#4ADE80'];
    for (var i = 0; i < 40; i++) {
      (function(index) {
        setTimeout(function() {
          var piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = (Math.random() * 100) + 'vw';
          piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          piece.style.width = (Math.random() * 8 + 4) + 'px';
          piece.style.height = (Math.random() * 8 + 4) + 'px';
          piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          piece.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
          piece.style.animationDelay = '0s';
          document.body.appendChild(piece);
          setTimeout(function() {
            if (piece.parentNode) piece.parentNode.removeChild(piece);
          }, 3500);
        }, index * 30);
      })(i);
    }
  }

  /* ---- Check-in Status ---- */
  function loadCheckinStatus() {
    fetch('/api/checkin/' + user.id + '/status')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.success && data.checkedIn) {
          setCheckedInState(data.streak || 0);
        } else if (data && data.streak !== undefined) {
          document.getElementById('streakCount').textContent = data.streak;
        } else {
          document.getElementById('streakCount').textContent = '0';
        }
        var streak = (data && data.streak) || 0;
        var progress = Math.min(streak / 7, 1);
        animateRing(progress);
      })
      .catch(function() {
        document.getElementById('streakCount').textContent = '0';
        animateRing(0);
      });
  }

  function animateRing(progress) {
    var ring = document.getElementById('checkinRing');
    var circumference = 2 * Math.PI * 65;
    var offset = circumference * (1 - progress);
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = offset;
  }

  function setCheckedInState(streak) {
    isCheckedIn = true;
    var btn = document.getElementById('checkinBtn');
    var icon = document.getElementById('checkinIcon');
    var label = document.getElementById('checkinLabel');
    btn.classList.add('checked-in');
    icon.innerHTML = '\u2705';
    label.textContent = '\u5DF2\u7B7E\u5230';
    document.getElementById('streakCount').textContent = streak;
    animateRing(Math.min(streak / 7, 1));
  }

  /* ---- Bind Check-in Button ---- */
  function bindCheckinButton() {
    document.getElementById('checkinBtn').addEventListener('click', function() {
      if (isCheckedIn) {
        showToast('\u4ECA\u5929\u5DF2\u7ECF\u7B7E\u5230\u8FC7\u4E86', 'info');
        return;
      }
      var btn = this;
      btn.disabled = true;
      fetch('/api/checkin/' + user.id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data && data.success) {
            setCheckedInState(data.streak || 1);
            btn.classList.add('pulse');
            setTimeout(function() { btn.classList.remove('pulse'); }, 800);
            launchConfetti();
            showToast('\u7B7E\u5230\u6210\u529F\uFF01+10 XP', 'success');
          } else {
            showToast(data.error || '\u7B7E\u5230\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5', 'error');
            btn.disabled = false;
          }
        })
        .catch(function() {
          showToast('\u7F51\u7EDC\u8FDE\u63A5\u5931\u8D25', 'error');
          btn.disabled = false;
        });
    });
  }

  /* ---- Challenge Templates ---- */
  var challengeTemplates = [
    { type: 'steps', icon: '\uD83D\uDC5E', name: '\u6B65\u884C8000\u6B65', desc: '\u65E5\u884C\u4E07\u6B65\uFF0C\u5065\u5EB7\u5E38\u9A7B', unit: '\u6B65', target: 8000, xp: 50, gradientClass: 'steps' },
    { type: 'workout', icon: '\uD83C\uDFAF', name: '\u5B8C\u621030\u5206\u949F\u8BAD\u7EC3', desc: '\u575A\u6301\u8FD0\u52A8\uFF0C\u5F3A\u5065\u4F53\u9B44', unit: '\u5206\u949F', target: 30, xp: 50, gradientClass: 'workout' },
    { type: 'calories', icon: '\uD83D\uDD25', name: '\u6D88\u8017500\u5343\u5361', desc: '\u71C3\u70E7\u5361\u8DEF\u91CC\uFF0C\u4FDD\u6301\u6D3B\u529B', unit: '\u5343\u5361', target: 500, xp: 50, gradientClass: 'calories' }
  ];

  /* ---- Load Challenges ---- */
  function loadChallenges() {
    fetch('/api/challenges/' + user.id)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('challengesSkeleton').style.display = 'none';
        document.getElementById('challengesList').style.display = 'block';
        var challenges;
        if (data && data.success && data.challenges && data.challenges.length > 0) {
          challenges = data.challenges;
        } else {
          challenges = [
            { type: 'steps', current: 5230, target: 8000, completed: false, xp: 50 },
            { type: 'workout', current: 15, target: 30, completed: false, xp: 50 },
            { type: 'calories', current: 320, target: 500, completed: false, xp: 50 }
          ];
        }
        renderChallenges(challenges);
      })
      .catch(function() {
        document.getElementById('challengesSkeleton').style.display = 'none';
        document.getElementById('challengesList').style.display = 'block';
        var challenges = [
          { type: 'steps', current: 5230, target: 8000, completed: false, xp: 50 },
          { type: 'workout', current: 15, target: 30, completed: false, xp: 50 },
          { type: 'calories', current: 320, target: 500, completed: false, xp: 50 }
        ];
        renderChallenges(challenges);
      });
  }

  /* ---- Render Challenges ---- */
  function renderChallenges(challenges) {
    var container = document.getElementById('challengesList');
    container.innerHTML = '';
    challenges.forEach(function(challenge, index) {
      var template = challengeTemplates.find(function(t) { return t.type === challenge.type; }) || challengeTemplates[index];
      var current = challenge.current || 0;
      var target = challenge.target || template.target;
      var completed = challenge.completed || (current >= target);
      var percent = Math.min((current / target) * 100, 100);

      var card = document.createElement('div');
      card.className = 'challenge-card' + (completed ? ' completed' : '');
      card.setAttribute('data-challenge-type', challenge.type);
      card.setAttribute('data-challenge-id', challenge.id || index);
      card.innerHTML =
        '<div class="completed-overlay">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</div>' +
        '<div class="challenge-header">' +
          '<div class="challenge-icon ' + template.gradientClass + '">' + template.icon + '</div>' +
          '<div class="challenge-info">' +
            '<div class="challenge-name">' + (challenge.name || template.name) + '</div>' +
            '<div class="challenge-desc">' + (challenge.description || template.desc) + '</div>' +
          '</div>' +
          '<div class="challenge-xp-badge">+' + (challenge.xp || template.xp) + ' XP</div>' +
        '</div>' +
        '<div class="challenge-progress-wrap">' +
          '<div class="challenge-progress-bar">' +
            '<div class="challenge-progress-fill ' + template.gradientClass + '-fill" data-percent="' + percent + '"></div>' +
          '</div>' +
          '<div class="challenge-progress-text">' +
            '<span class="challenge-current">' + current + ' ' + template.unit + '</span>' +
            '<span class="challenge-target">\u76EE\u6807 ' + target + ' ' + template.unit + '</span>' +
          '</div>' +
        '</div>';
      container.appendChild(card);
    });

    requestAnimationFrame(function() {
      setTimeout(function() {
        var fills = container.querySelectorAll('.challenge-progress-fill');
        fills.forEach(function(fill) {
          fill.style.width = fill.getAttribute('data-percent') + '%';
        });
      }, 100);
    });

    requestAnimationFrame(function() {
      document.getElementById('challengesList').classList.add('visible');
    });
  }

  /* ---- Heatmap ---- */
  function loadHeatmap() {
    fetch('/api/checkin/' + user.id + '/calendar')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var calendarData = [];
        if (data && data.success && data.calendar) {
          calendarData = data.calendar;
        }
        var stats = {
          total: (data && data.totalCheckins) || 0,
          maxStreak: (data && data.maxStreak) || 0,
          thisMonth: (data && data.thisMonth) || 0
        };
        renderHeatmap(calendarData, stats);
      })
      .catch(function() {
        var calendarData = generateMockCalendar();
        var stats = { total: 47, maxStreak: 12, thisMonth: 18 };
        renderHeatmap(calendarData, stats);
      });
  }

  function generateMockCalendar() {
    var data = {};
    var today = new Date();
    for (var i = 89; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = formatDateKey(d);
      if (Math.random() < 0.6) {
        data[key] = Math.floor(Math.random() * 4) + 1;
      }
    }
    return data;
  }

  function formatDateKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function renderHeatmap(calendarData, stats) {
    var canvas = document.getElementById('heatmapCanvas');
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;

    var cellSize = 13;
    var cellGap = 3;
    var cellStep = cellSize + cellGap;
    var leftPadding = 36;
    var topPadding = 20;
    var weeks = 13;
    var days = 7;
    var canvasWidth = leftPadding + weeks * cellStep + 10;
    var canvasHeight = topPadding + days * cellStep + 4;

    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';
    ctx.scale(dpr, dpr);

    var isDark = document.documentElement.classList.contains('dark');
    var emptyColor = isDark ? '#334155' : '#ebedf0';
    var textColor = isDark ? '#64748b' : '#94a3b8';

    var colorLevels = [emptyColor, '#86efac', '#22c55e', '#16a34a', '#15803d'];

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var startDate = new Date(today);
    startDate.setDate(startDate.getDate() - 89);
    var dayOfWeek = startDate.getDay();
    startDate.setDate(startDate.getDate() - dayOfWeek);

    var dayLabels = ['', '\u4E00', '', '\u4E09', '', '\u4E94', ''];
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var d = 0; d < 7; d++) {
      if (dayLabels[d]) {
        ctx.fillText(dayLabels[d], leftPadding - 6, topPadding + d * cellStep + cellSize / 2);
      }
    }

    var lastMonth = -1;
    var monthXPositions = [];

    var currentDate = new Date(startDate);
    for (var week = 0; week < weeks; week++) {
      for (var day = 0; day < days; day++) {
        var dateKey = formatDateKey(currentDate);
        var count = calendarData[dateKey] || 0;
        var level = Math.min(count, 4);
        var x = leftPadding + week * cellStep;
        var y = topPadding + day * cellStep;

        var radius = 2;
        ctx.fillStyle = colorLevels[level];
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + cellSize - radius, y);
        ctx.quadraticCurveTo(x + cellSize, y, x + cellSize, y + radius);
        ctx.lineTo(x + cellSize, y + cellSize - radius);
        ctx.quadraticCurveTo(x + cellSize, y + cellSize, x + cellSize - radius, y + cellSize);
        ctx.lineTo(x + radius, y + cellSize);
        ctx.quadraticCurveTo(x, y + cellSize, x, y + cellSize - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();

        var currentMonth = currentDate.getMonth();
        if (currentMonth !== lastMonth) {
          monthXPositions.push({ month: currentMonth, x: x });
          lastMonth = currentMonth;
        }
        currentDate.setDate(currentDate.getDate() + 1);
      }
    }

    var monthNames = ['1\u6708', '2\u6708', '3\u6708', '4\u6708', '5\u6708', '6\u6708', '7\u6708', '8\u6708', '9\u6708', '10\u6708', '11\u6708', '12\u6708'];
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    for (var m = 0; m < monthXPositions.length; m++) {
      var nextX = (m + 1 < monthXPositions.length) ? monthXPositions[m + 1].x : canvasWidth;
      if (nextX - monthXPositions[m].x > 30) {
        ctx.fillText(monthNames[monthXPositions[m].month], monthXPositions[m].x, 4);
      }
    }

    document.getElementById('totalCheckins').textContent = stats.total || '0';
    document.getElementById('maxStreak').textContent = stats.maxStreak || '0';
    document.getElementById('thisMonth').textContent = stats.thisMonth || '0';
  }

  /* Re-render heatmap when dark class changes */
  var themeObserver = new MutationObserver(function() {
    var canvas = document.getElementById('heatmapCanvas');
    if (canvas && canvas.width > 0) {
      setTimeout(function() {
        fetch('/api/checkin/' + user.id + '/calendar')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var calendarData = [];
            if (data && data.success && data.calendar) {
              calendarData = data.calendar;
            }
            var stats = {
              total: (data && data.totalCheckins) || 0,
              maxStreak: (data && data.maxStreak) || 0,
              thisMonth: (data && data.thisMonth) || 0
            };
            renderHeatmap(calendarData, stats);
          })
          .catch(function() {
            var calendarData = generateMockCalendar();
            renderHeatmap(calendarData, { total: 47, maxStreak: 12, thisMonth: 18 });
          });
      }, 100);
    }
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

})();

/* ====== 单点登录：被踢下线检测 ====== */
(function() {
  function checkKicked() {
