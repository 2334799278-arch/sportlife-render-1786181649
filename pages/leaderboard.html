<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>排行榜 - SportLife</title> <script src="/assets/vendor/tailwind.js"></script> <script> try { tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'PingFang SC', 'system-ui', 'sans-serif'] }, colors: { sf: { primary: '#22C55E', 'primary-hover': '#16A34A', 'primary-light': '#DCFCE7', 'primary-surface': '#F0FDF4', accent: '#F97316', 'accent-light': '#FFF7ED', sky: '#38BDF8', 'sky-light': '#F0F9FF', bg: '#FFFFFF', 'bg-secondary': '#F8FAFC', 'bg-tertiary': '#F1F5F9', 'text-primary': '#0F172A', 'text-secondary': '#475569', 'text-tertiary': '#94A3B8', 'border-light': '#E2E8F0', } }, borderRadius: { 'sf-md': '10px', 'sf-lg': '14px', 'sf-xl': '20px', 'sf-full': '9999px' }, boxShadow: { 'sf-md': '0 4px 12px rgba(0,0,0,0.05)' }, } } } } catch(e) {} </script> <style id="theme-vars"> :root { --sf-primary: #22C55E; --sf-primary-hover: #16A34A; --sf-primary-light: #DCFCE7; --sf-primary-surface: #F0FDF4; --sf-accent: #F97316; --sf-accent-light: #FFF7ED; --sf-sky: #38BDF8; --sf-sky-light: #F0F9FF; --sf-bg: #FFFFFF; --sf-bg-secondary: #F8FAFC; --sf-bg-tertiary: #F1F5F9; --sf-text-primary: #0F172A; --sf-text-secondary: #475569; --sf-text-tertiary: #94A3B8; --sf-border-light: #E2E8F0; --sf-font-sans: 'Inter', 'PingFang SC', system-ui, sans-serif; --sf-radius-md: 10px; --sf-radius-lg: 14px; --sf-radius-xl: 20px; --sf-radius-full: 9999px; --sf-shadow-md: 0 4px 12px rgba(0,0,0,0.05); /* Leaderboard tokens */ --lb-gold: #FFD700; --lb-silver: #C0C0C0; --lb-bronze: #CD7F32; --lb-gold-bg: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); --lb-silver-bg: linear-gradient(135deg, #E8E8E8 0%, #A0A0A0 100%); --lb-bronze-bg: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%); --lb-gold-glow: 0 0 20px rgba(255, 215, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.15); --lb-silver-glow: 0 0 16px rgba(192, 192, 192, 0.35), 0 0 32px rgba(192, 192, 192, 0.1); --lb-bronze-glow: 0 0 14px rgba(205, 127, 50, 0.35), 0 0 28px rgba(205, 127, 50, 0.1); --lb-current-user-bg: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%); --lb-current-user-border: #22C55E; } html.dark { --sf-bg: #0F172A; --sf-bg-secondary: #1E293B; --sf-bg-tertiary: #334155; --sf-text-primary: #F8FAFC; --sf-text-secondary: #CBD5E1; --sf-text-tertiary: #64748B; --sf-border-light: #334155; --lb-current-user-bg: linear-gradient(135deg, #1E293B 0%, #14532D 100%); --lb-current-user-border: #22C55E; --lb-gold-glow: 0 0 20px rgba(255, 215, 0, 0.25), 0 0 40px rgba(255, 215, 0, 0.08); --lb-silver-glow: 0 0 16px rgba(192, 192, 192, 0.2), 0 0 32px rgba(192, 192, 192, 0.06); --lb-bronze-glow: 0 0 14px rgba(205, 127, 50, 0.2), 0 0 28px rgba(205, 127, 50, 0.06); } * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; } body { font-family: var(--sf-font-sans); background: var(--sf-bg); color: var(--sf-text-primary); min-height: 100vh; padding-bottom: 80px; transition: background 0.3s, color 0.3s; } body, main { max-width: 430px; margin: 0 auto !important; } /* ===== Header ===== */ .lb-header { background: var(--sf-bg-secondary); border-bottom: 1px solid var(--sf-border-light); transition: background 0.3s; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); } .lb-header-inner { display: flex; align-items: center; justify-content: center; height: 56px; padding: 0 16px; position: relative; } .lb-header .back-link { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; color: var(--sf-text-primary); transition: background 0.15s; } .lb-header .back-link:active { background: var(--sf-bg-tertiary); } .lb-header h1 { font-size: 18px; font-weight: 700; color: var(--sf-text-primary); letter-spacing: -0.01em; } /* ===== Tab Bar ===== */ .lb-tabs-wrap { background: var(--sf-bg-secondary); border-bottom: 1px solid var(--sf-border-light); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; transition: background 0.3s; } .lb-tabs-wrap::-webkit-scrollbar { display: none; } .lb-tabs { display: flex; gap: 6px; padding: 10px 16px 12px; min-width: max-content; } .lb-tab { flex-shrink: 0; padding: 8px 16px; border-radius: var(--sf-radius-full); font-size: 13px; font-weight: 600; color: var(--sf-text-secondary); background: var(--sf-bg-tertiary); text-decoration: none; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; user-select: none; white-space: nowrap; } .lb-tab:hover { background: var(--sf-primary-light); color: var(--sf-primary-hover); } .lb-tab.active { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); color: #FFFFFF; box-shadow: 0 2px 12px rgba(34, 197, 94, 0.35); transform: scale(1.02); } /* ===== Podium (Top 3) ===== */ .lb-podium { padding: 24px 16px 16px; display: flex; align-items: flex-end; justify-content: center; gap: 10px; } .lb-podium-card { flex: 1; max-width: 120px; border-radius: var(--sf-radius-xl); padding: 20px 10px 18px; text-align: center; position: relative; overflow: hidden; animation: podiumSlideUp 0.6s ease both; } .lb-podium-card::before { content: ''; position: absolute; inset: 0; opacity: 0.12; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.5), transparent 70%); } .lb-podium-card.rank-1 { background: var(--lb-gold-bg); box-shadow: var(--lb-gold-glow); min-height: 200px; animation-delay: 0.1s; order: 2; } .lb-podium-card.rank-2 { background: var(--lb-silver-bg); box-shadow: var(--lb-silver-glow); min-height: 175px; animation-delay: 0.25s; order: 1; } .lb-podium-card.rank-3 { background: var(--lb-bronze-bg); box-shadow: var(--lb-bronze-glow); min-height: 155px; animation-delay: 0.4s; order: 3; } @keyframes podiumSlideUp { 0% { opacity: 0; transform: translateY(30px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } } .lb-podium-avatar { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; border: 3px solid rgba(255,255,255,0.6); position: relative; z-index: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.15); } .lb-podium-card.rank-1 .lb-podium-avatar { width: 60px; height: 60px; font-size: 24px; border-color: rgba(255,255,255,0.8); animation: crownBounce 2s ease-in-out infinite; } @keyframes crownBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } .lb-podium-badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #FFFFFF; z-index: 2; } .lb-podium-card.rank-1 .lb-podium-badge { background: #FFD700; box-shadow: 0 0 8px rgba(255,215,0,0.6); } .lb-podium-card.rank-2 .lb-podium-badge { background: #A0A0A0; box-shadow: 0 0 6px rgba(192,192,192,0.4); } .lb-podium-card.rank-3 .lb-podium-badge { background: #CD7F32; box-shadow: 0 0 6px rgba(205,127,50,0.4); } .lb-podium-name { font-size: 13px; font-weight: 700; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,0.3); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; z-index: 1; } .lb-podium-title { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.75); text-shadow: 0 1px 2px rgba(0,0,0,0.2); margin-bottom: 8px; position: relative; z-index: 1; } .lb-podium-value { font-size: 18px; font-weight: 900; color: #FFFFFF; text-shadow: 0 1px 4px rgba(0,0,0,0.25); position: relative; z-index: 1; line-height: 1; } .lb-podium-unit { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7); margin-top: 2px; position: relative; z-index: 1; } .lb-podium-card.rank-1 .lb-podium-value { font-size: 22px; } /* ===== Rank List (4th+) ===== */ .lb-list { padding: 0 16px 24px; } .lb-list-item { display: flex; align-items: center; gap: 12px; padding: 14px 14px; background: var(--sf-bg-secondary); border-radius: var(--sf-radius-lg); margin-bottom: 8px; transition: all 0.25s ease; position: relative; overflow: hidden; animation: listItemFadeIn 0.4s ease both; box-shadow: 0 2px 8px rgba(0,0,0,0.03), 0 4px 16px rgba(0,0,0,0.02); } .lb-list-item::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(34,197,94,0.02), transparent); opacity: 0; transition: opacity 0.3s; } .lb-list-item:active::before { opacity: 1; } .lb-list-item:active { transform: scale(0.985); } .lb-list-item.is-current-user { background: var(--lb-current-user-bg); border: 2px solid var(--lb-current-user-border); box-shadow: 0 0 16px rgba(34, 197, 94, 0.12); } .lb-list-item.is-current-user .lb-rank-number { background: linear-gradient(135deg, #22C55E, #16A34A); color: #FFFFFF; font-weight: 800; } @keyframes listItemFadeIn { 0% { opacity: 0; transform: translateX(-12px); } 100% { opacity: 1; transform: translateX(0); } } .lb-rank-number { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--sf-bg-tertiary); color: var(--sf-text-secondary); flex-shrink: 0; transition: background 0.2s, color 0.2s; } .lb-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; color: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow: hidden; } .lb-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; } .lb-info { flex: 1; min-width: 0; } .lb-name { font-size: 14px; font-weight: 600; color: var(--sf-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lb-title-text { font-size: 12px; font-weight: 400; color: var(--sf-text-tertiary); margin-top: 1px; } .lb-value-wrap { text-align: right; flex-shrink: 0; } .lb-value { font-size: 16px; font-weight: 800; color: var(--sf-text-primary); line-height: 1; } .lb-unit { font-size: 11px; font-weight: 500; color: var(--sf-text-tertiary); margin-top: 2px; } .lb-list-item.is-current-user .lb-value { color: var(--sf-primary-hover); } /* ===== Empty State ===== */ .lb-empty { text-align: center; padding: 60px 20px; animation: listItemFadeIn 0.5s ease both; } .lb-empty-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--sf-bg-tertiary); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; } .lb-empty-text { font-size: 15px; font-weight: 500; color: var(--sf-text-tertiary); } .lb-empty-sub { font-size: 13px; color: var(--sf-text-tertiary); margin-top: 6px; } /* ===== Loading ===== */ .lb-loading { text-align: center; padding: 40px 20px; } .lb-spinner { width: 36px; height: 36px; border: 3px solid var(--sf-bg-tertiary); border-top-color: var(--sf-primary); border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } /* ===== Bottom Tab Bar ===== */ .lb-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; width: 100%; max-width: 430px; background: var(--sf-bg); border-top: 1px solid rgba(0,0,0,0.06); box-shadow: 0 -4px 24px rgba(0,0,0,0.04); z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); transition: background 0.3s ease, border-color 0.3s ease; } html.dark .lb-bottom-nav { background: var(--sf-bg); border-top: 1px solid rgba(255,255,255,0.06); box-shadow: 0 -4px 24px rgba(0,0,0,0.2); } .lb-bottom-nav-inner { display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; } .lb-bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; transition: all 0.15s; } .lb-bottom-nav a:active { opacity: 0.7; } .lb-bottom-nav a span { font-size: 10px; font-weight: 500; color: var(--sf-text-tertiary); transition: color 0.15s; } .lb-bottom-nav a.active span { font-weight: 600; color: var(--sf-primary); } .lb-bottom-nav a.active svg { stroke: var(--sf-primary); } /* ===== Trophy decoration ===== */ .lb-section-title { display: flex; align-items: center; gap: 8px; padding: 0 16px; margin-bottom: 12px; } .lb-section-title h2 { font-size: 14px; font-weight: 700; color: var(--sf-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; } .lb-section-title-line { flex: 1; height: 1px; background: var(--sf-border-light); } /* ===== Sparkle for rank 1 ===== */ .lb-podium-card.rank-1::after { content: ''; position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; background: radial-gradient(circle, rgba(255,215,0,0.3), transparent 70%); animation: sparkle 3s ease-in-out infinite; } @keyframes sparkle { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } } </style> <script src="theme-init.js"></script> <script src="ngrok-fix.js"></script>

<body> <!-- ===== HEADER ===== --> <header class="lb-header"> <div class="lb-header-inner"> <a href="home.html" class="back-link" aria-label="返回"> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polyline points="15 18 9 12 15 6"></polyline> </svg> </a> <h1>排行榜</h1> </div> </header> <!-- ===== TAB BAR ===== --> <div class="lb-tabs-wrap"> <div class="lb-tabs" id="tab-bar"> <a href="#" class="lb-tab active" data-type="total_workouts">运动次数</a> <a href="#" class="lb-tab" data-type="total_distance_km">总距离</a> <a href="#" class="lb-tab" data-type="total_calories">卡路里</a> <a href="#" class="lb-tab" data-type="streak_days">连续打卡</a> <a href="#" class="lb-tab" data-type="total_xp">等级</a> </div> </div> <!-- ===== MAIN CONTENT ===== --> <main> <!-- Podium for top 3 --> <div class="lb-podium" id="podium-area"> <!-- Filled by JS --> </div> <!-- List for rank 4+ --> <div class="lb-section-title" id="section-title" style="display:none;"> <h2>排名</h2> <div class="lb-section-title-line"></div> </div> <div class="lb-list" id="rank-list"> <!-- Filled by JS --> </div> <!-- Loading state --> <div class="lb-loading" id="loading-indicator" style="display:none;"> <div class="lb-spinner"></div> <p style="font-size:14px; color:var(--sf-text-tertiary); font-weight:500;">加载中...</p> </div> <!-- Empty state --> <div class="lb-empty" id="empty-state" style="display:none;"> <div class="lb-empty-icon"> <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--sf-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M6 9l6-6 6 6"/><path d="M12 3v15"/> </svg> </div> <p class="lb-empty-text">暂无排名数据</p> <p class="lb-empty-sub">快去运动，争夺第一名吧</p> </div> </main> <!-- ===== BOTTOM TAB BAR ===== --> <nav class="lb-bottom-nav"> <div class="lb-bottom-nav-inner"> <a href="home.html"> <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> <span>首页</span> </a> <a href="workout-tracker.html"> <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg> <span>训练</span> </a> <a href="course-detail.html"> <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> <span>课程</span> </a> <a href="community.html"> <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span>社区</span> </a> <a href="profile.html"> <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> <span>我的</span> </a> </div> </nav> <script>
(function() {
  'use strict';

  /* ===== Auth Check ===== */
  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem('sportlife_user')); }
    catch (e) { return null; }
  }
  var currentUser = getCurrentUser();
  if (!currentUser) {
    navigateTo('login.html');
    return;
  }

  /* ===== State ===== */
  var currentType = 'total_workouts';

  var TYPE_CONFIG = {
    total_workouts: { label: '次', unit: '次' },
    total_distance_km: { label: 'km', unit: 'km' },
    total_calories: { label: 'kcal', unit: '千卡' },
    streak_days: { label: '天', unit: '天' },
    total_xp: { label: 'XP', unit: 'XP' }
  };

  var AVATAR_COLORS = [
    '#22C55E', '#F97316', '#38BDF8', '#A855F7', '#EF4444',
    '#F59E0B', '#06B6D4', '#EC4899', '#8B5CF6', '#10B981',
    '#3B82F6', '#14B8A6', '#E11D48', '#6366F1', '#84CC16'
  ];

  function getAvatarColor(index) {
    return AVATAR_COLORS[index % AVATAR_COLORS.length];
  }

  function getInitial(name) {
    if (!name) return 'U';
    return name.charAt(0).toUpperCase();
  }

  function formatNumber(num) {
    if (num == null || num === 0) return '--';
    if (typeof num !== 'number') num = parseFloat(num) || 0;
    if (num === 0) return '--';
    if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
    return Math.round(num).toLocaleString('zh-CN');
  }

  /* ===== Tab Switching ===== */
  var tabBar = document.getElementById('tab-bar');
  var tabs = tabBar.querySelectorAll('.lb-tab');

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();

      /* Deactivate all tabs, activate clicked */
      tabs.forEach(function(t) {
        t.classList.remove('active');
      });
      this.classList.add('active');

      /* Set current type and load data */
      currentType = this.getAttribute('data-type');
      loadLeaderboard(currentType);
    });
  });

  /* ===== Load Leaderboard Data ===== */
  async function loadLeaderboard(type) {
    var podiumArea = document.getElementById('podium-area');
    var rankList = document.getElementById('rank-list');
    var sectionTitle = document.getElementById('section-title');
    var loadingIndicator = document.getElementById('loading-indicator');
    var emptyState = document.getElementById('empty-state');

    /* Show loading state */
    podiumArea.innerHTML = '';
    rankList.innerHTML = '';
    sectionTitle.style.display = 'none';
    emptyState.style.display = 'none';
    loadingIndicator.style.display = 'block';

    try {
      var res = await fetch('/api/leaderboard?type=' + encodeURIComponent(type));
      var data = await res.json();
      loadingIndicator.style.display = 'none';

      if (data.success && data.leaderboard && data.leaderboard.length > 0) {
        renderLeaderboard(data.leaderboard, type);
      } else {
        emptyState.style.display = 'block';
      }
    } catch (err) {
      loadingIndicator.style.display = 'none';
      emptyState.style.display = 'block';
    }
  }

  /* ===== Render Leaderboard ===== */
  function renderLeaderboard(list, type) {
    var podiumArea = document.getElementById('podium-area');
    var rankList = document.getElementById('rank-list');
    var sectionTitle = document.getElementById('section-title');
    var config = TYPE_CONFIG[type] || { unit: '' };

    /* Split into top 3 and rest */
    var top3 = list.slice(0, 3);
    var rest = list.slice(3);

    /* Render podium */
    if (top3.length > 0) {
      var podiumHTML = '';
      top3.forEach(function(user, index) {
        var rank = index + 1;
        var isMe = currentUser && (user.id === currentUser.id || user.user_id === currentUser.id);
        var avatarColor = getAvatarColor(user.id || index);
        var initial = getInitial(user.nickname || user.username);
        var value = formatNumber(user.value);
        var avatarHTML = '';
        if (user.avatar_url) {
          avatarHTML = '<img src="' + user.avatar_url + '" alt="' + (user.nickname || user.username) + '">';
        } else {
          avatarHTML = '<span style="color:#FFF">' + initial + '</span>';
        }
        var levelText = user.level ? ('Lv.' + user.level) : '';
        var titleText = user.title || levelText || '';
        var isCurrentClass = isMe ? ' is-current-user' : '';
        podiumHTML += '' +
          '<div class="lb-podium-card rank-' + rank + isCurrentClass + '">' +
            '<div class="lb-podium-badge">' + rank + '</div>' +
            '<div class="lb-podium-avatar" style="background:' + avatarColor + '">' + avatarHTML + '</div>' +
            '<div class="lb-podium-name">' + (user.nickname || user.username || '用户' + rank) + '</div>' +
            '<div class="lb-podium-title">' + titleText + (isMe ? ' (我)' : '') + '</div>' +
            '<div class="lb-podium-value">' + value + '</div>' +
            '<div class="lb-podium-unit">' + config.unit + '</div>' +
          '</div>';
      });
      podiumArea.innerHTML = podiumHTML;
    } else {
      podiumArea.innerHTML = '';
    }

    /* Render rank list (4th+) */
    if (rest.length > 0) {
      sectionTitle.style.display = 'flex';
      var listHTML = '';
      rest.forEach(function(user, index) {
        var rank = index + 4;
        var isMe = currentUser && (user.id === currentUser.id || user.user_id === currentUser.id);
        var avatarColor = getAvatarColor(user.id || (index + 3));
        var initial = getInitial(user.nickname || user.username);
        var value = formatNumber(user.value);
        var avatarHTML = '';
        if (user.avatar_url) {
          avatarHTML = '<img src="' + user.avatar_url + '" alt="' + (user.nickname || user.username) + '">';
        } else {
          avatarHTML = '<span style="color:#FFF">' + initial + '</span>';
        }
        var levelText = user.level ? ('Lv.' + user.level) : '';
        var titleText = user.title || levelText || '';
        var currentClass = isMe ? ' is-current-user' : '';
        listHTML += '' +
          '<div class="lb-list-item' + currentClass + '" style="animation-delay:' + (index * 0.06) + 's">' +
            '<div class="lb-rank-number">' + rank + '</div>' +
            '<div class="lb-avatar" style="background:' + avatarColor + '">' + avatarHTML + '</div>' +
            '<div class="lb-info">' +
              '<div class="lb-name">' + (user.nickname || user.username || '用户' + rank) +
                (isMe ? ' <span style="color:var(--sf-primary);font-size:12px;font-weight:500;">(我)</span>' : '') +
              '</div>' +
              '<div class="lb-title-text">' + titleText + '</div>' +
            '</div>' +
            '<div class="lb-value-wrap">' +
              '<div class="lb-value">' + value + '</div>' +
              '<div class="lb-unit">' + config.unit + '</div>' +
            '</div>' +
          '</div>';
      });
      rankList.innerHTML = listHTML;
    } else {
      sectionTitle.style.display = 'none';
      rankList.innerHTML = '';
    }
  }

  /* ===== Initial Load ===== */
  loadLeaderboard(currentType);

})();
/* ====== 单点登录：被踢下线检测 ====== */
(function() {
  function checkKicked() {
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    var sid = localStorage.getItem('sportlife_session_id') || '';
    if (!user.id || !sid) return;
    fetch('/api/session/kicked/' + user.id + '/' + sid).then(function(r){return r.json();}).then(function(data) {
      if (data.kicked) {
        localStorage.removeItem('sportlife_user');
        localStorage.removeItem('sportlife_session_id');
        // 显示被踢提示
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center';
        overlay.innerHTML = '<div style="background:white;border-radius:20px;padding:32px 24px;width:300px;max-width:85vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="10"/></svg></div>' +
          '<h3 style="font-size:17px;font-weight:600;color:#1E293B;margin:0 0 8px">账号已在其他设备登录</h3>' +
          '<p style="font-size:14px;color:#64748B;line-height:1.6;margin:0 0 24px">你的账号在其他设备上登录了，当前设备已下线。</p>' +
          '<button onclick="this.closest(\'div\').parentElement.remove();window.location.href=\'login.html\'" style="width:100%;padding:12px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,#22C55E,#16A34A);color:white;box-shadow:0 4px 12px rgba(34,197,94,0.3)">重新登录</button></div>';
        document.body.appendChild(overlay);
      }
    }).catch(function(){});
  }
  // 每 15 秒检测一次
  setTimeout(function() { checkKicked(); setInterval(checkKicked, 15000); }, 5000);
})();
