nd: var(--sf-bg-secondary); color: var(--sf-text-primary); max-width: 480px; margin: 0 auto !important; position: relative; } /* Leaflet overrides */ .leaflet-control-zoom { display: none !important; } .leaflet-control-attribution { font-size: 10px !important; opacity: 0.5; } /* Pulse animation for start button */ @keyframes pulseRing { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } } @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 50% { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); } } .pulse-btn { animation: pulseGlow 2s ease-in-out infinite; } .pulse-btn::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; background: var(--sf-primary); animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; z-index: -1; } /* Workout type pills */ .workout-type-pill { transition: all var(--sf-transition-normal); white-space: nowrap; user-select: none; cursor: pointer; } .workout-type-pill:active { transform: scale(0.95); } /* Stats card glass effect */ .stats-card { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); } /* Timer styling */ .timer-display { font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: color 0.3s ease; } /* Stat value animation */ .stat-value { transition: all 0.3s ease; font-variant-numeric: tabular-nums; } /* Toast */ @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } } .toast-anim { animation: toastIn 300ms ease forwards; } /* Summary modal */ .summary-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 300ms ease; } .summary-overlay.active { opacity: 1; pointer-events: auto; } .summary-panel { width: 100%; max-width: 480px; max-height: 90vh; background: var(--sf-bg); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 400ms cubic-bezier(0.32, 0.72, 0, 1); overflow-y: auto; } .summary-overlay.active .summary-panel { transform: translateY(0); } /* Confetti / celebration */ @keyframes confettiDrop { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } } .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; z-index: 10001; pointer-events: none; } @keyframes checkmarkBounce { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } } .checkmark-anim { animation: checkmarkBounce 0.6s ease forwards; } @keyframes circleGrow { 0% { transform: scale(0); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } } .circle-anim { animation: circleGrow 0.5s ease forwards; } /* Lock screen */ .lock-screen { position: fixed; inset: 0; background: var(--sf-bg); z-index: 8000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 300ms ease; } .lock-screen.active { opacity: 1; pointer-events: auto; } /* Control button transitions */ .ctrl-btn { transition: all 0.25s ease; box-shadow: 0 4px 16px rgba(0,0,0,0.12); } .ctrl-btn:active { transform: scale(0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.1); } /* GPS manual mode banner */

v> </div> </div> <div class="flex items-center gap-3 p-3 rounded-xl" style="background: var(--sf-bg);"> <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--sf-primary-light);"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sf-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/> </svg> </div> <div> <div class="text-[11px]" style="color: var(--sf-text-tertiary);">平均配速</div> <div class="text-base font-bold" id="sum-pace" style="color: var(--sf-text-primary);">0'00"</div> </div> </div> <div class="flex items-center gap-3 p-3 rounded-xl" style="background: var(--sf-bg);"> <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--sf-accent-light);"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sf-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/> </svg> </div> <div> <div class="text-[11px]" style="color: var(--sf-text-tertiary);">消耗卡路里</div> <div class="text-base font-bold" id="sum-calories" style="color: var(--sf-text-primary);">0 kcal</div> </div> </div> <div class="flex items-center gap-3 p-3 rounded-xl" style="background: var(--sf-bg);"> <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--sf-sky-light);"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sf-sky)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M13 4v16"/><path d="M17 4v16"/><path d="M19 4H9.5a4.5 4.5 0 0 0 0 9h5a4.5 4.5 0 0 1 0 9H5"/> </svg> </div> <div> <div class="text-[11px]" style="color: var(--sf-text-tertiary);">步数</div> <div class="text-base font-bold" id="sum-steps" style="color: var(--sf-text-primary);">0 步</div> </div> </div> <div class="flex items-center gap-3 p-3 rounded-xl" style="background: var(--sf-bg);"> <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--sf-primary-light);"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sf-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/> </svg> </div> <div> <div class="text-[11px]" style="color: var(--sf-text-tertiary);">运动类型</div> <div class="text-base font-bold" id="sum-type" style="color: var(--sf-text-primary);">跑步</div> </div> </div> </div> </div> <!-- Action buttons --> <div class="mx-4 mb-8 flex gap-3"> <button onclick="discardWorkout()" class="flex-1 py-3 rounded-xl text-sm font-semibold ctrl-btn" style="background: var(--sf-bg-tertiary); color: var(--sf-text-secondary);"> 放弃 </button> <button onclick="saveWorkout()" class="flex-1 py-3 rounded-xl text-sm font-semibold text-white ctrl-btn" style="background: var(--sf-primary);"> 保存训练 </button> </div> </div> </div> <!-- ==================== SCRIPTS ==================== --> <script src="/assets/vendor/leaflet.js"></script>
<script>/* AUTH CHECK */
(function checkAuth() {
  try {
    var u = JSON.parse(localStorage.getItem('sportlife_user'));
    if (!u || !u.id) {
      showToast('请先登录', 'error');
      setTimeout(function() { navigateTo('login.html'); }, 1200);
    }
  } catch (e) {
    navigateTo('login.html');
  }
})();

/* STATE */
var watchId = null;
var trackPoints = [];
var workoutStartTime = null;
var pausedDuration = 0;
var pauseStartTime = null;
var timerRAF = null;
var totalSteps = 0;
var selectedType = '跑步';
var workoutState = 'ready';
var gpsAvailable = false;
var isLocked = false;
var map = null;
var summaryMap = null;
var polyline = null;
var currentMarker = null;
var startMarker = null;
var intervalDuration = 30;
var intervalElapsed = 0;
var intervalTimerRAF = null;

/* SPORT TYPE CONFIGURATIONS */
var SPORT_CONFIGS = {
  '跑步': { emoji: '🏃', calPerMin: 10, stepPerMeter: 1.43, simSpeed: 2.5, hasRoute: true, hasPace: true, intervalEnabled: false, manualLabel: '开始你的跑步之旅', routeColor: '#22C55E', statLabel: '配速', statUnit: 'min/km' },
  '骑行': { emoji: '🚴', calPerMin: 8, stepPerMeter: 0, simSpeed: 5.5, hasRoute: true, hasPace: false, intervalEnabled: false, manualLabel: '开始你的骑行之旅', routeColor: '#38BDF8', statLabel: '速度', statUnit: 'km/h' },
  '步行': { emoji: '🚶', calPerMin: 5, stepPerMeter: 1.5, simSpeed: 1.2, hasRoute: true, hasPace: true, intervalEnabled: false, manualLabel: '开始你的步行之旅', routeColor: '#F97316', statLabel: '配速', statUnit: 'min/km' },
  'HIIT': { emoji: '🔥', calPerMin: 14, stepPerMeter: 0.8, simSpeed: 0, hasRoute: false, hasPace: false, intervalEnabled: true, intervalDuration: 30, manualLabel: '开始你的HIIT训练', routeColor: '#EF4444', statLabel: '次数', statUnit: '组' },
  '瑜伽': { emoji: '🧘', calPerMin: 4, stepPerMeter: 0, simSpeed: 0, hasRoute: false, hasPace: false, intervalEnabled: true, intervalDuration: 60, manualLabel: '开始你的瑜伽练习', routeColor: '#A855F7', statLabel: '时长', statUnit: 'min' },
  '力量': { emoji: '💪', calPerMin: 8, stepPerMeter: 0, simSpeed: 0, hasRoute: false, hasPace: false, intervalEnabled: true, intervalDuration: 45, manualLabel: '开始你的力量训练', routeColor: '#F59E0B', statLabel: '组数', statUnit: '组' }
};

/* WORKOUT TYPE SELECTOR */
function selectType(btn) {
  selectedType = btn.dataset.type;
  document.querySelectorAll('.workout-type-pill').forEach(function(p) {
    p.style.background = 'var(--sf-bg)';
    p.style.color = 'var(--sf-text-secondary)';
    p.style.border = '1.5px solid var(--sf-border-light)';
  });
  btn.style.background = 'var(--sf-primary)';
  btn.style.color = '#fff';
  btn.style.border = '1.5px solid var(--sf-primary)';
  /* 更新 manual banner */
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  document.getElementById('manual-emoji').textContent = config.emoji;
  document.querySelector('.manual-title').textContent = config.manualLabel;
  /* 室内运动显示 manual banner，户外运动显示地图 */
  if (config.hasRoute) {
    document.getElementById('map-container').style.display = 'block';
    document.getElementById('manual-banner').style.display = 'none';
  } else {
    document.getElementById('map-container').style.display = 'none';
    document.getElementById('manual-banner').style.display = 'flex';
  }
  /* 更新 stat label */
  var paceLabel = document.querySelector('#stat-pace').parentElement.previousElementSibling;
  if (paceLabel) paceLabel.textContent = config.statLabel;
  var paceUnit = document.querySelector('#stat-pace').parentElement.nextElementSibling;
  if (paceUnit) paceUnit.textContent = config.statUnit;
}

/* MAP */
function initMap(lat, lng) {
  if (map) { map.setView([lat, lng], 16); return; }
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var routeColor = config.routeColor || '#22C55E';
  map = L.map('map-container', { center: [lat, lng], zoom: 16, zoomControl: false, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
  polyline = L.polyline([], { color: routeColor, weight: 4, opacity: 0.85, smoothFactor: 1, lineJoin: 'round', lineCap: 'round' }).addTo(map);
  var userIcon = L.divIcon({ html: '<div style="width:18px;height:18px;background:' + routeColor + ';border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>', iconSize: [18, 18], iconAnchor: [9, 9], className: '' });
  L.marker([lat, lng], { icon: userIcon }).addTo(map);
  setTimeout(function() { map.invalidateSize(); }, 300);
}

function updateMap(point) {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var routeColor = config.routeColor || '#22C55E';
  var latlng = [point.lat, point.lng];
  if (!startMarker) {
    var startIcon = L.divIcon({ html: '<div style="width:20px;height:20px;background:' + routeColor + ';border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>', iconSize: [20, 20], iconAnchor: [10, 10], className: '' });
    startMarker = L.marker(latlng, { icon: startIcon }).addTo(map);
  }
  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.circleMarker(latlng, { radius: 8, fillColor: '#38BDF8', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
  polyline.addLatLng(latlng);
  map.panTo(latlng, { animate: true, duration: 0.5 });
}

function getUserLocation(cb) {
  if (!navigator.geolocation) { cb(null, new Error('no geo')); return; }
  var timeoutId = setTimeout(function() { cb(null, new Error('GPS timeout')); }, 5000);
  navigator.geolocation.getCurrentPosition(
    function(pos) { clearTimeout(timeoutId); cb({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
    function(err) { clearTimeout(timeoutId); cb(null, err); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 5000 }
  );
}

/* GPS STATUS */
function setGpsStatus(connected) {
  var dot = document.getElementById('gps-dot');
  var text = document.getElementById('gps-text');
  if (connected) {
    dot.style.background = '#22C55E';
    text.textContent = 'GPS已连接';
  } else {
    dot.style.background = '#EF4444';
    text.textContent = 'GPS未连接';
  }
}

/* TIMER */
function startTimerLoop() {
  function tick() {
    if (workoutState === 'paused' || workoutState === 'ready') return;
    updateTimerDisplay();
    updateLockTimer();
    timerRAF = requestAnimationFrame(tick);
  }
  timerRAF = requestAnimationFrame(tick);
}

function updateTimerDisplay() {
  if (!workoutStartTime) return;
  var elapsed = (Date.now() - workoutStartTime - pausedDuration) / 1000;
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  var wholeSecs = Math.floor(secs);
  var hundredths = Math.floor((secs - wholeSecs) * 100);
  var html = String(mins).padStart(2, '0') + ':' + String(wholeSecs).padStart(2, '0') + '<span class="text-3xl font-bold" style="color: var(--sf-text-tertiary);">.' + String(hundredths).padStart(2, '0') + '</span>';
  document.getElementById('timer-display').innerHTML = html;
}

function updateLockTimer() {
  if (!workoutStartTime) return;
  var elapsed = (Date.now() - workoutStartTime - pausedDuration) / 1000;
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  var wholeSecs = Math.floor(secs);
  var hundredths = Math.floor((secs - wholeSecs) * 100);
  var html = String(mins).padStart(2, '0') + ':' + String(wholeSecs).padStart(2, '0') + '<span class="text-4xl font-bold" style="color: var(--sf-text-tertiary);">.' + String(hundredths).padStart(2, '0') + '</span>';
  document.getElementById('lock-timer').innerHTML = html;
}

/* INTERVAL TIMER */
function startIntervalTimer() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  if (config.intervalEnabled && config.intervalDuration) {
    intervalDuration = config.intervalDuration;
  }
  intervalElapsed = 0;
  if (config.intervalEnabled) {
    document.getElementById('interval-section').style.display = 'block';
  } else {
    document.getElementById('interval-section').style.display = 'none';
    return;
  }
  function tick() {
    if (workoutState === 'paused' || workoutState === 'ready') return;
    intervalElapsed += 0.1;
    if (intervalElapsed >= intervalDuration) { intervalElapsed = 0; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
    var progress = Math.min((intervalElapsed / intervalDuration) * 100, 100);
    document.getElementById('interval-bar').style.width = progress + '%';
    var elapsedStr = formatIntervalTime(intervalElapsed);
    var totalStr = formatIntervalTime(intervalDuration);
    document.getElementById('interval-label').textContent = elapsedStr + ' / ' + totalStr;
    intervalTimerRAF = requestAnimationFrame(tick);
  }
  intervalTimerRAF = requestAnimationFrame(tick);
}

function stopIntervalTimer() {
  if (intervalTimerRAF) cancelAnimationFrame(intervalTimerRAF);
  document.getElementById('interval-section').style.display = 'none';
}

function formatIntervalTime(sec) {
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/* SIMULATED GPS TRACKING */
var simTrackInterval = null;

function startSimulatedTracking() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var simSpeed = config.simSpeed || 2.5;
  var route = [
    { lat: 39.9042, lng: 116.3974 },
    { lat: 39.9035, lng: 116.3976 },
    { lat: 39.9025, lng: 116.3980 },
    { lat: 39.9015, lng: 116.3988 },
    { lat: 39.9005, lng: 116.3998 },
    { lat: 39.8995, lng: 116.4010 },
    { lat: 39.8985, lng: 116.4025 },
    { lat: 39.8975, lng: 116.4040 },
    { lat: 39.8968, lng: 116.4055 },
    { lat: 39.8960, lng: 116.4070 },
    { lat: 39.8955, lng: 116.4085 },
    { lat: 39.8952, lng: 116.4100 },
    { lat: 39.8950, lng: 116.4115 },
    { lat: 39.8948, lng: 116.4130 },
    { lat: 39.8947, lng: 116.4145 },
    { lat: 39.8948, lng: 116.4160 },
    { lat: 39.8950, lng: 116.4175 },
    { lat: 39.8955, lng: 116.4188 },
    { lat: 39.8962, lng: 116.4200 },
    { lat: 39.8970, lng: 116.4210 }
  ];
  var routeIdx = 0;
  var totalRoutePoints = route.length;
  var prevPt = null;
  var simInterval = config.simSpeed > 3 ? 2000 : 3000;
  simTrackInterval = setInterval(function() {
    if (workoutState !== 'running') return;
    if (routeIdx >= totalRoutePoints) { routeIdx = 0; }
    var pt = route[routeIdx];
    var point = {
      lat: pt.lat + (Math.random() - 0.5) * 0.0003,
      lng: pt.lng + (Math.random() - 0.5) * 0.0003,
      alt: 50,
      acc: 10,
      speed: simSpeed + Math.random() * 1.5,
      time: new Date().toISOString()
    };
    trackPoints.push(point);
    prevPt = point;
    if (map) updateMap(point);
    updateStats();
    routeIdx++;
  }, simInterval);
}

function stopSimulatedTracking() {
  if (simTrackInterval) { clearInterval(simTrackInterval); simTrackInterval = null; }
}

/* GPS TRACKING */
function startTracking() {
  gpsAvailable = false;
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(
      function(pos) {
        gpsAvailable = true;
        var point = { lat: pos.coords.latitude, lng: pos.coords.longitude, alt: pos.coords.altitude, acc: pos.coords.accuracy, speed: pos.speed, time: new Date().toISOString() };
        trackPoints.push(point);
        if (map) updateMap(point);
        updateStats();
        setGpsStatus(true);
      },
      function(err) { setGpsStatus(false); if (!gpsAvailable) { showToast('GPS不可用，已切换手动模式', 'info'); } },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  } else {
    setGpsStatus(false);
    showToast('浏览器不支持GPS，已切换手动模式', 'info');
  }
}

function initStepCounter() {
  var lastAccel = { x: 0, y: 0, z: 0 };
  var stepThreshold = 1.2;
  var lastStepTime = 0;
  document.addEventListener('devicemotion', function(e) {
    if (workoutState !== 'running') return;
    var accel = e.accelerationIncludingGravity;
    if (accel) {
      var delta = Math.abs(accel.x - lastAccel.x) + Math.abs(accel.y - lastAccel.y) + Math.abs(accel.z - lastAccel.z);
      var now = Date.now();
      if (delta > stepThreshold && (now - lastStepTime) > 250) {
        totalSteps++;
        lastAccel = { x: accel.x, y: accel.y, z: accel.z };
        lastStepTime = now;
      }
    }
  });
  return true; // sensor initialized
}

function startPedometer() {
  // Only start pedometer, do NOT start sim here
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(function(state) {
      if (state === 'granted') { initStepCounter(); }
    }).catch(function() {});
  } else if (window.DeviceMotionEvent) {
    initStepCounter();
  }
}

/* SIMULATED STEP COUNTER (for desktop / no sensor) */
var simStepInterval = null;
var lastSimStepTrackLen = 0; // track last known trackPoints length to detect GPS movement
function startSimSteps() {
  if (simStepInterval) return;
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  if (config.stepPerMeter <= 0) return; // No steps for indoor sports without sensor
  // Realistic walking cadence: ~2 steps/sec for walking, ~2.8 for running
  var stepsPerSec = selectedType === '跑步' ? 2.8 : selectedType === '步行' ? 2.0 : 1.5;
  if (stepsPerSec <= 0) return;
  lastSimStepTrackLen = trackPoints.length;
  simStepInterval = setInterval(function() {
    if (workoutState !== 'running') return;
    // Only add steps if GPS shows user is actually moving (new track points added)
    // or if GPS is not available (fallback to timer-based simulation)
    if (gpsAvailable && config.hasRoute) {
      if (trackPoints.length <= lastSimStepTrackLen) return; // stationary, no steps
      lastSimStepTrackLen = trackPoints.length;
    }
    // Add slight randomness for realism
    var jitter = 0.8 + Math.random() * 0.4; // 0.8 ~ 1.2
    totalSteps += Math.max(1, Math.round(stepsPerSec * jitter));
    updateStats();
  }, 1000);
}
function stopSimSteps() {
  if (simStepInterval) { clearInterval(simStepInterval); simStepInterval = null; }
}

function stopTracking() {
  stopSimulatedTracking();
  stopSimSteps();
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (timerRAF) cancelAnimationFrame(timerRAF);
  stopIntervalTimer();
}

/* STATS UPDATE */
function updateStats() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var distKm = calculateDistance(trackPoints);
  if (distKm < 0.01 && totalSteps > 0) { distKm = Math.round(totalSteps * 0.0007 * 100) / 100; }
  var elapsed = Math.floor((Date.now() - workoutStartTime - pausedDuration) / 1000);
  var durationMin = elapsed / 60;

  /* 卡路里 */
  var cals = Math.round(durationMin * config.calPerMin + totalSteps * 0.04 + distKm * 60);

  /* 配速或速度 */
  var paceStr = "0'00\"";
  if (distKm > 0.01 && durationMin > 0) {
    if (config.hasPace) {
      var paceMinPerKm = durationMin / distKm;
      var pMin = Math.floor(paceMinPerKm);
      var pSec = Math.round((paceMinPerKm - pMin) * 60);
      paceStr = pMin + "'" + String(pSec).padStart(2, '0') + '"';
    } else {
      /* 速度 km/h */
      var speedKmh = distKm / (durationMin / 60);
      paceStr = speedKmh.toFixed(1);
    }
  }

  document.getElementById('stat-distance').textContent = distKm.toFixed(2);
  document.getElementById('stat-pace').textContent = paceStr;
  document.getElementById('stat-calories').textContent = cals;
  document.getElementById('stat-steps').textContent = totalSteps;
  document.getElementById('lock-dist').textContent = distKm.toFixed(2);
  document.getElementById('lock-cal').textContent = cals;
  document.getElementById('lock-steps').textContent = totalSteps;
}

function startStatsLoop() {
  setInterval(function() { if (workoutState === 'running') updateStats(); }, 1000);
}

/* HAVERSINE DISTANCE */
function calculateDistance(points) {
  if (points.length < 2) return 0;
  var total = 0;
  for (var i = 1; i < points.length; i++) {
    var R = 6371;
    var dLat = (points[i].lat - points[i - 1].lat) * Math.PI / 180;
    var dLon = (points[i].lng - points[i - 1].lng) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(points[i - 1].lat * Math.PI / 180) * Math.cos(points[i].lat * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    total += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  return Math.round(total * 100) / 100;
}

/* WORKOUT STATE MANAGEMENT */
function setWorkoutState(state) {
  workoutState = state;
  document.getElementById('controls-ready').style.display = state === 'ready' ? 'flex' : 'none';
  document.getElementById('controls-running').style.display = state === 'running' ? 'flex' : 'none';
  document.getElementById('controls-paused').style.display = state === 'paused' ? 'flex' : 'none';
  document.getElementById('type-selector').style.display = state === 'ready' ? 'block' : 'none';
  var label = document.getElementById('timer-label');
  if (state === 'ready') label.textContent = '准备开始';
  else if (state === 'running') label.textContent = selectedType + ' 进行中...';
  else if (state === 'paused') label.textContent = '已暂停';
}

function startWorkout() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  /* 立即切换 UI 状态，不让用户等 GPS */
  workoutStartTime = Date.now();
  trackPoints = [];
  totalSteps = 0;
  pausedDuration = 0;
  startTimerLoop();
  startIntervalTimer();
  startStatsLoop();
  startPedometer();
  startSimSteps();
  setWorkoutState('running');
  /* 室内运动 */
  if (!config.hasRoute) {
    if (simTrackInterval) { clearInterval(simTrackInterval); simTrackInterval = null; }
    document.getElementById('map-container').style.display = 'none';
    document.getElementById('manual-banner').style.display = 'flex';
    document.getElementById('gps-badge').style.display = 'none';
    if (config.intervalEnabled && config.intervalDuration) { intervalDuration = config.intervalDuration; }
    return;
  }
  /* 户外运动：后台获取 GPS，不阻塞 UI */
  document.getElementById('map-container').style.display = 'block';
  document.getElementById('manual-banner').style.display = 'none';
  startTracking();
  getUserLocation(function(pos, err) {
    if (pos && !err) {
      if (!map) { initMap(pos.lat, pos.lng); setGpsStatus(true); }
      else { map.setView([pos.lat, pos.lng], 16); setGpsStatus(true); }
    } else {
      if (!map && typeof initMap === 'function' && typeof L !== 'undefined') { initMap(39.9042, 116.4074); }
      setGpsStatus(false);
      document.getElementById('gps-text').textContent = '模拟中';
      startSimulatedTracking();
    }
  });
}

function pauseWorkout() { pauseStartTime = Date.now(); workoutState = 'paused'; setWorkoutState('paused'); stopSimSteps(); }

function resumeWorkout() {
  if (pauseStartTime) { pausedDuration += Date.now() - pauseStartTime; pauseStartTime = null; }
  workoutState = 'running'; setWorkoutState('running'); startTimerLoop(); startIntervalTimer(); startSimSteps();
}

function requestEndWorkout() { var modal = document.getElementById('end-modal'); modal.style.opacity = '1'; modal.style.pointerEvents = 'auto'; }
function closeEndModal() { var modal = document.getElementById('end-modal'); modal.style.opacity = '0'; modal.style.pointerEvents = 'none'; }

/* confirmEndWorkout: converted from async to sync */
function confirmEndWorkout() {
  closeEndModal();
  stopTracking();
  if (isLocked) toggleLock();
  /* 恢复 UI */
  document.getElementById('map-container').style.display = 'block';
  document.getElementById('manual-banner').style.display = 'none';
  document.getElementById('gps-badge').style.display = 'flex';
  workoutState = 'ended';
  showSummaryModal();
}

/* LOCK SCREEN */
function toggleLock() {
  isLocked = !isLocked;
  var lockEl = document.getElementById('lock-screen');
  if (isLocked) { lockEl.classList.add('active'); } else { lockEl.classList.remove('active'); }
}

/* SUMMARY MODAL */
function showSummaryModal() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var elapsed = Math.floor((Date.now() - workoutStartTime - pausedDuration) / 1000);
  var distKm = calculateDistance(trackPoints);
  if (distKm < 0.01 && totalSteps > 0) { distKm = Math.round(totalSteps * 0.0007 * 100) / 100; }
  var durationMin = elapsed / 60;
  var cals = Math.round(durationMin * config.calPerMin + totalSteps * 0.04 + distKm * 60);

  /* 配速/速度/时长 */
  var paceStr = "0'00\"";
  if (config.hasPace) {
    if (distKm > 0.01 && durationMin > 0) {
      var paceMinPerKm = durationMin / distKm;
      var pMin = Math.floor(paceMinPerKm);
      var pSec = Math.round((paceMinPerKm - pMin) * 60);
      paceStr = pMin + "'" + String(pSec).padStart(2, '0') + '"';
    }
    document.getElementById('sum-pace').textContent = paceStr + ' /km';
  } else if (!config.hasRoute) {
    /* 室内运动：显示运动时长 */
    document.getElementById('sum-pace').textContent = Math.floor(durationMin) + ' min';
  } else {
    /* 骑行：显示速度 */
    if (distKm > 0.01 && durationMin > 0) {
      var speedKmh = distKm / (durationMin / 60);
      document.getElementById('sum-pace').textContent = speedKmh.toFixed(1) + ' km/h';
    } else {
      document.getElementById('sum-pace').textContent = '0.0 km/h';
    }
  }

  /* 更新 summary 配速标签 */
  var sumPaceCard = document.getElementById('sum-pace');
  if (sumPaceCard) {
    var labelEl = sumPaceCard.closest('.flex').querySelector('.text-\\[11px\\]');
    if (labelEl) {
      if (config.hasPace) labelEl.textContent = '平均配速';
      else if (!config.hasRoute) labelEl.textContent = '运动时长';
      else labelEl.textContent = '平均速度';
    }
  }

  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  document.getElementById('sum-time').textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  document.getElementById('sum-distance').textContent = distKm.toFixed(2) + ' km';
  document.getElementById('sum-calories').textContent = cals + ' kcal';
  document.getElementById('sum-steps').textContent = totalSteps + ' 步';
  document.getElementById('sum-type').textContent = selectedType;
  var mapContainer = document.getElementById('summary-map-container');
  if (trackPoints.length > 1) { mapContainer.style.display = 'block'; setTimeout(function() { initSummaryMap(); }, 400); }
  else { mapContainer.style.display = 'none'; }
  var overlay = document.getElementById('summary-overlay');
  overlay.classList.add('active');
  launchConfetti();
}

function initSummaryMap() {
  var config = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var routeColor = config.routeColor || '#22C55E';
  if (summaryMap) { summaryMap.remove(); summaryMap = null; }
  var el = document.getElementById('summary-map');
  summaryMap = L.map(el, { center: trackPoints.length > 0 ? [trackPoints[0].lat, trackPoints[0].lng] : [39.9042, 116.4074], zoom: 15, zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(summaryMap);
  var latlngs = trackPoints.map(function(p) { return [p.lat, p.lng]; });
  L.polyline(latlngs, { color: routeColor, weight: 4, opacity: 0.85, smoothFactor: 1, lineJoin: 'round', lineCap: 'round' }).addTo(summaryMap);
  L.circleMarker(latlngs[0], { radius: 6, fillColor: routeColor, color: '#fff', weight: 2, fillOpacity: 1 }).addTo(summaryMap);
  if (latlngs.length > 1) { L.circleMarker(latlngs[latlngs.length - 1], { radius: 6, fillColor: '#EF4444', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(summaryMap); }
  summaryMap.fitBounds(L.polyline(latlngs).getBounds().pad(0.2));
  setTimeout(function() { summaryMap.invalidateSize(); }, 100);
}

function hideSummaryModal() { document.getElementById('summary-overlay').classList.remove('active'); }

/* CONFETTI */
function launchConfetti() {
  var colors = ['#22C55E', '#F97316', '#38BDF8', '#F59E0B', '#EF4444', '#A855F7', '#EC4899'];
  for (var i = 0; i < 60; i++) {
    (function(index) {
      setTimeout(function() {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '-10px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (Math.random() * 8 + 6) + 'px';
        piece.style.height = (Math.random() * 8 + 6) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animation = 'confettiDrop ' + (Math.random() * 2 + 2) + 's linear forwards';
        document.body.appendChild(piece);
        setTimeout(function() { piece.remove(); }, 4500);
      }, index * 30);
    })(i);
  }
}

/* SAVE WORKOUT (converted from async to Promise.then) */
function saveWorkout() {
  var user = JSON.parse(localStorage.getItem('sportlife_user'));
  if (!user) {
    showToast('请先登录', 'error');
    setTimeout(function() { navigateTo('login.html'); }, 1200);
    return;
  }
  var elapsed = Math.floor((Date.now() - workoutStartTime - pausedDuration) / 1000);
  var distKm = calculateDistance(trackPoints);
  if (distKm < 0.01 && totalSteps > 0) { distKm = Math.round(totalSteps * 0.0007 * 100) / 100; }
  var saveConfig = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
  var cals = Math.round(elapsed / 60 * saveConfig.calPerMin + totalSteps * 0.04 + distKm * 60);
  var workoutPayload = JSON.stringify({ userId: user.id, type: selectedType, name: selectedType + '训练', duration_minutes: Math.floor(elapsed / 60), duration_seconds: elapsed % 60, calories_burned: cals, steps: totalSteps, distance_km: distKm });
  fetch('/api/workouts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: workoutPayload }).then(function(res) {
    return res.json();
  }).then(function(data) {
    var chain = Promise.resolve();
    if (data.workout && trackPoints.length > 0) {
      chain = fetch('/api/tracks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workoutId: data.workout.id, userId: user.id, points: trackPoints }) }).then(function() { return Promise.resolve(); });
    }
    chain = chain.then(function() {
      return fetch('/api/steps', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: user.id, steps: totalSteps, distance_km: distKm, calories: cals }) });
    });
    chain = chain.then(function() {
      var xpEarned = Math.max(10, Math.round(cals / 5 + elapsed / 60 * 2));
      return fetch('/api/xp/' + user.id + '/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ xp: xpEarned, workout_type: selectedType, distance_km: distKm, calories: cals, duration_minutes: Math.round(elapsed / 60) }) }).then(function() {
        showToast('训练已保存! +' + xpEarned + ' XP', 'success');
      }).catch(function() {
        showToast('训练已保存!', 'success');
      });
    });
    chain.then(function() {
      hideSummaryModal();
      setTimeout(function() { navigateTo('home.html'); }, 1500);
    });
  }).catch(function(err) {
    showToast('保存失败，请检查网络连接', 'error');
  });
}

/* DISCARD WORKOUT */
function discardWorkout() {
  hideSummaryModal();
  showToast('训练已放弃', 'info');
  setTimeout(function() { navigateTo('home.html'); }, 800);
}

/* TOAST */
function showToast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast-anim';
  var bg = type === 'success' ? '#22C55E' : type === 'error' ? '#EF4444' : '#38BDF8';
  t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;color:white;font-size:14px;z-index:10000;background:' + bg + ';font-family:var(--sf-font-sans);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.15);';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

/* INIT */
(function init() {
  function waitAndInit() {
    if (typeof L !== 'undefined' && typeof L.map === 'function') { doInit(); }
    else { setTimeout(waitAndInit, 100); }
  }
  function doInit() {
    getUserLocation(function(pos, err) {
      var lat = 39.9042, lng = 116.4074;
      var gpsOk = false;
      if (pos && !err) { lat = pos.lat; lng = pos.lng; gpsOk = true; }
      if (typeof initMap === 'function' && typeof L !== 'undefined') {
        initMap(lat, lng);
        if (gpsOk) {
          setGpsStatus(true);
          var banner = document.getElementById('manual-banner');
          if (banner) banner.style.display = 'none';
        } else {
          setGpsStatus(false);
          document.getElementById('gps-text').textContent = 'GPS未定位';
          var banner = document.getElementById('manual-banner');
          if (banner) {
            banner.style.display = 'flex';
            banner.style.opacity = '0.85';
            banner.style.background = 'rgba(255,255,255,0.88)';
            var titleEl = banner.querySelector('.manual-title');
            if (titleEl) titleEl.textContent = 'GPS 未定位，使用模拟位置';
            var descEl = banner.querySelector('.manual-desc');
            if (descEl) descEl.textContent = '运动将使用模拟数据';
          }
        }
      } else {
        setGpsStatus(false);
        document.getElementById('gps-text').textContent = '手动模式';
        var banner = document.getElementById('manual-banner');
        if (banner) banner.style.display = 'flex';
      }
      var emojiEl = document.getElementById('manual-emoji');
      var titleEl2 = document.querySelector('.manual-title');
      if (emojiEl && titleEl2) {
        var initConfig = SPORT_CONFIGS[selectedType] || SPORT_CONFIGS['跑步'];
        emojiEl.textContent = initConfig.emoji;
        if (!gpsOk) { titleEl2.textContent = initConfig.manualLabel; }
      }
      /* 只在用户未手动选择其他类型时，才按默认类型设置地图/banner */
      if (selectedType === '跑步') {
        var defaultConfig = SPORT_CONFIGS['跑步'];
        document.getElementById('map-container').style.display = 'block';
        document.getElementById('manual-banner').style.display = 'none';
      }
    });
  }
  waitAndInit();
})();

/* Bind start button via addEventListener */
var startBtn = document.getElementById('start-btn');
if (startBtn) {
  startBtn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); startWorkout(); }, true);
}

/* Bind all workout control buttons via JS */
var btnBindings = [
  { sel: '[onclick="toggleLock()"]', fn: toggleLock },
  { sel: '[onclick="pauseWorkout()"]', fn: pauseWorkout },
  { sel: '[onclick="resumeWorkout()"]', fn: resumeWorkout },
  { sel: '[onclick="requestEndWorkout()"]', fn: requestEndWorkout },
  { sel: '[onclick="closeEndModal()"]', fn: closeEndModal },
  { sel: '[onclick="confirmEndWorkout()"]', fn: confirmEndWorkout },
  { sel: '[onclick="discardWorkout()"]', fn: discardWorkout },
  { sel: '[onclick="saveWorkout()"]', fn: saveWorkout }
];
btnBindings.forEach(function(b) {
  var els = document.querySelectorAll(b.sel);
  els.forEach(function(el) { el.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); b.fn(); }, true); });
});</script>
