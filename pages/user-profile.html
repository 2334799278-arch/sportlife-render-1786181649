<body> <!-- ===== HEADER ===== --> <header class="profile-header"> <div class="profile-header-inner"> <a href="javascript:history.back()" class="back-btn" id="back-btn" aria-label="返回"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M15 18l-6-6 6-6"/> </svg> </a> <h1 id="header-title">用户主页</h1> </div> </header> <!-- ===== LOADING STATE ===== --> <div class="page-loading" id="page-loading"> <div class="page-spinner"></div> <span style="font-size:13px;color:var(--sf-text-tertiary);">加载中...</span> </div> <!-- ===== MAIN CONTENT ===== --> <main id="main-content" style="display:none;"> <!-- ===== PROFILE CARD ===== --> <section class="profile-card" id="profile-card"> <!-- Avatar --> <div class="avatar-ring" id="avatar-wrap"> <div class="avatar-inner" id="avatar-display"> <!-- JS renders avatar --> </div> </div> <!-- Nickname --> <h2 id="profile-nickname" style="font-size:20px;font-weight:800;color:var(--sf-text-primary);margin-bottom:var(--sf-space-sm);">--</h2> <!-- Level badge --> <div class="level-badge" id="profile-level" style="display:none;"></div> <!-- Bio --> <p class="profile-bio" id="profile-bio"></p> <!-- Stats row --> <div class="stats-row" id="stats-row"> <div class="stat-item"> <div class="stat-value" id="stat-followers">0</div> <div class="stat-label">粉丝</div> </div> <div class="stat-item"> <div class="stat-value" id="stat-following">0</div> <div class="stat-label">关注</div> </div> <div class="stat-item"> <div class="stat-value" id="stat-workouts">0</div> <div class="stat-label">运动次数</div> </div> </div> </section> <!-- ===== INFO CARD ===== --> <section class="info-card" id="info-card"> <div class="info-title">个人信息</div> <div id="info-content"> <!-- JS renders: info-grid or privacy-hidden --> </div> </section> <!-- ===== TABS ===== --> <div class="profile-tabs" id="profile-tabs"> <button class="profile-tab active" data-tab="posts"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/> </svg> 动态 </button> <button class="profile-tab" data-tab="workouts"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/> </svg> 运动 </button> <button class="profile-tab" data-tab="achievements"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/> </svg> 成就 </button> </div> <!-- ===== TAB CONTENT ===== --> <div class="tab-content-area" id="tab-content-area"> <!-- Posts Panel --> <div class="tab-panel active" id="panel-posts"> <div id="posts-list"> <div class="empty-state" id="posts-loading"> <div class="skeleton" style="width:100%;height:14px;margin-bottom:8px;"></div> <div class="skeleton" style="width:75%;height:14px;margin-bottom:16px;"></div> <div class="skeleton" style="width:100%;height:160px;border-radius:var(--sf-radius-md);"></div> </div> </div> </div> <!-- Workouts Panel --> <div class="tab-panel" id="panel-workouts"> <div id="workouts-list"> <div class="empty-state" id="workouts-loading"> <div class="skeleton" style="width:80%;height:14px;margin-bottom:8px;"></div> <div class="skeleton" style="width:50%;height:12px;"></div> </div> </div> </div> <!-- Achievements Panel --> <div class="tab-panel" id="panel-achievements"> <div id="achievements-list"> <div class="empty-state" id="achievements-loading"> <div class="skeleton" style="width:100%;height:14px;margin-bottom:8px;"></div> <div class="skeleton" style="width:60%;height:12px;"></div> </div> </div> </div> </div> </main> <!-- ===== BOTTOM ACTION BAR ===== --> <div class="bottom-action-bar" id="bottom-bar" style="display:none;"> <button class="btn-greet" id="btn-greet"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/> </svg> <span>打招呼</span> </button> <button class="btn-add-friend" id="add-friend-btn"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/> <line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/> </svg> <span>加好友</span> </button> <button class="btn-follow" id="btn-follow"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"> <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/> </svg> </button> </div> <!-- ===== JAVASCRIPT ===== --> <script>
(function() { 'use strict';

  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem('sportlife_user')); }
    catch (e) { return null; }
  }

  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

  function getContrastColor(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    var r = parseInt(hex.substr(0, 2), 16);
    var g = parseInt(hex.substr(2, 2), 16);
    var b = parseInt(hex.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? '#0F172A' : '#FFFFFF';
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return '\u521A\u521A';
    if (diff < 3600000) return Math.floor(diff / 60000) + '\u5206\u949F\u524D';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '\u5C0F\u65F6\u524D';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '\u5929\u524D';
    var month = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() === now.getFullYear() ? (month + '\u6708' + day + '\u65E5') : (d.getFullYear() + '\u5E74' + month + '\u6708' + day + '\u65E5');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function showToast(msg, type) {
    document.querySelectorAll('.toast-msg').forEach(function(t) { t.remove(); });
    var t = document.createElement('div');
    t.className = 'toast-msg';
    t.style.background = (type === 'success') ? 'var(--sf-primary)' : (type === 'error' ? 'var(--sf-error)' : 'var(--sf-text-secondary)');
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function() { requestAnimationFrame(function() { t.classList.add('show'); }); });
    setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2500);
  }

  var currentUser = getCurrentUser();
  var targetUid = null;
  var profileData = null;
  var isFollowing = false;
  var currentTab = 'posts';

  function getWorkoutTypeIcon(type) {
    var icons = {};
    icons['\u8DD1\u6B65'] = '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M13.5 5.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.1 7.1 0 0 0 21 13.2V11.1a5.1 5.1 0 0 1-4.5-2.8l-1-1.6a2 2 0 0 0-1.7-1 2 2 0 0 0-.9.2L7 8.3V13h2V9.6l1.8-.7"/></svg>';
    icons['HIIT'] = '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
    icons['\u745C\u4F3D'] = '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><circle cx="12" cy="4" r="2"/><path d="M12 6v6l-4 8h2l2-4 2 4h2l-4-8V6z"/></svg>';
    icons['\u529B\u91CF\u8BAD\u7EC3'] = '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M6.5 6.5h11M5 8h2m10 0h2M7 14h10M5 12h2m10 0h2M5 10v4M19 10v4M3 8h2v8H3zM19 8h2v8h-2z"/></svg>';
    return icons[type] || icons['HIIT'];
  }

  var ACH_GRAD = {
    'running_expert': 'achievement-icon--green', '\u8DD1\u6B65\u8FBE\u4EBA': 'achievement-icon--green',
    '7day_streak': 'achievement-icon--orange', '\u8FDE\u7EED7\u5929': 'achievement-icon--orange',
    'strength_star': 'achievement-icon--blue', '\u529B\u91CF\u4E4B\u661F': 'achievement-icon--blue',
    'yoga_beginner': 'achievement-icon--purple', '\u745C\u4F3D\u65B0\u624B': 'achievement-icon--purple',
    '100day_commit': 'achievement-icon--gold', '\u767E\u65E5\u575A\u6301': 'achievement-icon--gold',
    '10k_steps': 'achievement-icon--green-blue', '\u4E07\u6B65\u8FBE\u4EBA': 'achievement-icon--green-blue',
    'half_marathon': 'achievement-icon--orange-red', '\u534A\u7A0B\u9A6C\u62C9\u677E': 'achievement-icon--orange-red'
  };
  var ACH_EMOJI = {
    'running_expert': '\uD83C\uDFC3', '\u8DD1\u6B65\u8FBE\u4EBA': '\uD83C\uDFC3',
    '7day_streak': '\uD83D\uDD25', '\u8FDE\u7EED7\u5929': '\uD83D\uDD25',
    'strength_star': '\uD83D\uDCAA', '\u529B\u91CF\u4E4B\u661F': '\uD83D\uDCAA',
    'yoga_beginner': '\uD83E\uDDD8', '\u745C\u4F3D\u65B0\u624B': '\uD83E\uDDD8',
    '100day_commit': '\u2B50', '\u767E\u65E5\u575A\u6301': '\u2B50',
    '10k_steps': '\uD83C\uDFC5', '\u4E07\u6B65\u8FBE\u4EBA': '\uD83C\uDFC5',
    'half_marathon': '\uD83C\uDFC6', '\u534A\u7A0B\u9A6C\u62C9\u677E': '\uD83C\uDFC6'
  };

  async function loadProfile() {
    try {
      var res = await fetch('/api/user/' + targetUid + '/public');
      var data = await res.json();
      if (!data.success) { showToast('\u7528\u6237\u4E0D\u5B58\u5728\u6216\u5DF2\u6CE8\u9500', 'error'); return; }
      profileData = data.user || data;
      renderProfile();
    } catch (e) { showToast('\u52A0\u8F7D\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5', 'error'); }
  }

  function renderProfile() {
    if (!profileData) return;
    var d = profileData;
    var nickname = d.nickname || d.username || '\u7528\u6237';
    document.getElementById('header-title').textContent = nickname;
    var avatarEl = document.getElementById('avatar-display');
    var bgColor = d.avatar_color || '#DCFCE7';
    if (d.avatar_url) {
      avatarEl.innerHTML = '<img src="' + escapeHtml(d.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
      avatarEl.style.background = 'transparent';
    } else {
      avatarEl.style.background = bgColor;
      avatarEl.innerHTML = '<span style="color:' + getContrastColor(bgColor) + ';user-select:none;">' + escapeHtml(nickname.charAt(0).toUpperCase()) + '</span>';
    }
    document.getElementById('profile-nickname').textContent = nickname;
    var levelEl = document.getElementById('profile-level');
    var level = d.level || d.user_level;
    var title = d.title || d.level_title;
    if (level || title) {
      levelEl.textContent = (level ? 'Lv.' + level : '') + (level && title ? ' ' : '') + (title || '');
      levelEl.style.display = 'inline-flex';
    } else { levelEl.style.display = 'none'; }
    var bioEl = document.getElementById('profile-bio');
    if (d.bio_visible === false || d.privacy_bio) {
      bioEl.textContent = '\u8BE5\u7528\u6237\u672A\u516C\u5F00\u7B80\u4ECB'; bioEl.style.fontStyle = 'italic';
    } else { bioEl.textContent = d.bio || ''; bioEl.style.fontStyle = 'normal'; }
    document.getElementById('stat-followers').textContent = d.followers_count || d.fans_count || 0;
    document.getElementById('stat-following').textContent = d.following_count || 0;
    document.getElementById('stat-workouts').textContent = d.total_workouts || d.workout_count || 0;
    renderInfoCard(d);
    document.getElementById('page-loading').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('bottom-bar').style.display = 'flex';
    loadFollowStatus();
    loadTabData(currentTab);
  }

  function renderInfoCard(d) {
    var el = document.getElementById('info-content');
    if (d.privacy_profile) {
      el.innerHTML = '<div class="privacy-hidden"><div class="privacy-hidden-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><p>\u8BE5\u7528\u6237\u672A\u516C\u5F00\u6B64\u4FE1\u606F</p></div>';
      return;
    }
    var h = d.height ? d.height + 'cm' : '--', w = d.weight ? d.weight + 'kg' : '--';
    var created = d.created_at ? '\u6CE8\u518C\u4E8E ' + formatDate(d.created_at) : '';
    el.innerHTML = '<div class="info-grid"><div class="info-item"><div class="info-item-value">' + escapeHtml(String(d.age || '--')) + '</div><div class="info-item-label">\u5E74\u9F84</div></div><div class="info-item"><div class="info-item-value">' + escapeHtml(h) + '</div><div class="info-item-label">\u8EAB\u9AD8</div></div><div class="info-item"><div class="info-item-value">' + escapeHtml(w) + '</div><div class="info-item-label">\u4F53\u91CD</div></div></div>' + (created ? '<div class="info-meta">' + escapeHtml(created) + '</div>' : '');
  }

  async function loadFollowStatus() {
    if (!currentUser || !targetUid) return;
    try {
      var res = await fetch('/api/social/' + currentUser.id + '?target=' + targetUid);
      var data = await res.json();
      if (data.success) isFollowing = !!(data.isFollowing || data.is_following || data.following);
    } catch (e) {}
    updateFollowButton(); updateGreetButton();
  }

  function updateFollowButton() {
    var btn = document.getElementById('btn-follow');
    if (isFollowing) {
      btn.classList.add('following');
      btn.innerHTML = '<span style="font-size:13px;font-weight:700;">已关注</span>';
    } else {
      btn.classList.remove('following');
      btn.innerHTML = '<span style="font-size:13px;font-weight:700;">关注</span>';
    }
  }

  function updateGreetButton() {
    var btn = document.getElementById('btn-greet');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>' + (isFollowing ? '\u53D1\u6D88\u606F' : '\u6253\u62DB\u547C') + '</span>';
  }

  var followConfirmPending = false;

  async function toggleFollow() {
    if (!currentUser) { showToast('请先登录', 'error'); return; }
    var btn = document.getElementById('btn-follow');
    if (btn.disabled) return;

    // Douyin-style: if following and not in confirm state, show "取消关注" option
    if (isFollowing && !followConfirmPending) {
      followConfirmPending = true;
      btn.innerHTML = '<span style="font-size:13px;font-weight:700;">取消关注</span>';
      btn.style.background = 'transparent';
      btn.style.color = 'var(--sf-error)';
      btn.style.borderColor = 'var(--sf-error)';
      // Reset after 3 seconds if not clicked again
      setTimeout(function() {
        if (followConfirmPending) {
          followConfirmPending = false;
          updateFollowButton();
          btn.style.background = '';
          btn.style.color = '';
          btn.style.borderColor = '';
        }
      }, 3000);
      return;
    }

    // Reset confirm state
    followConfirmPending = false;
    btn.style.background = '';
    btn.style.color = '';
    btn.style.borderColor = '';

    btn.disabled = true;
    btn.style.opacity = '0.6';
    try {
      // Server uses a single POST toggle endpoint
      var res = await fetch('/api/follow/' + currentUser.id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target_user_id: targetUid })
      });
      var data = await res.json();
      if (data.success || data.followed !== undefined) {
        isFollowing = !!(data.followed || data.success && !isFollowing);
        // Re-check: if data.followed is explicitly set, use that
        if (data.followed === false) isFollowing = false;
        if (data.followed === true) isFollowing = true;
        updateFollowButton(); updateGreetButton();
        showToast(isFollowing ? '关注成功' : '已取消关注', 'success');
        var el = document.getElementById('stat-followers');
        var c = parseInt(el.textContent) || 0;
        el.textContent = isFollowing ? c + 1 : Math.max(0, c - 1);
      } else {
        showToast(data.message || '操作失败', 'error');
      }
    } catch (e) { showToast('网络错误，请重试', 'error'); }
    btn.disabled = false;
    btn.style.opacity = '1';
  }

  function checkRelationStatus() {
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    var uid = new URLSearchParams(window.location.search).get('uid');
    if (!user.id || !uid || user.id === uid) return;
    fetch('/api/friends/check?user_id=' + user.id + '&target_id=' + uid)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var btn = document.getElementById('add-friend-btn');
        if (!btn) return;
        if (data.is_friend) { btn.querySelector('span').textContent = '\u5DF2\u662F\u597D\u53CB'; btn.disabled = true; btn.classList.add('disabled'); }
        else if (data.status === 'pending') { btn.querySelector('span').textContent = '\u8BF7\u6C42\u4E2D'; btn.disabled = true; btn.classList.add('disabled'); }
      }).catch(function() {});
  }

  function sendFriendRequest() {
    var btn = document.getElementById('add-friend-btn');
    if (btn.disabled) return;
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    var uid = new URLSearchParams(window.location.search).get('uid');
    if (!user.id || !uid) return;
    fetch('/api/friends/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from_user_id: user.id, to_user_id: uid })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) { btn.querySelector('span').textContent = '\u8BF7\u6C42\u4E2D'; btn.disabled = true; btn.classList.add('disabled'); showToast('\u597D\u53CB\u8BF7\u6C42\u5DF2\u53D1\u9001', 'success'); }
        else { showToast(data.message || '\u53D1\u9001\u5931\u8D25', 'error'); }
      }).catch(function() { showToast('\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u91CD\u8BD5', 'error'); });
  }

  function switchTab(tab) {
    if (tab === currentTab) return;
    currentTab = tab;
    document.querySelectorAll('.profile-tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel-' + tab);
    if (panel) { void panel.offsetWidth; panel.classList.add('active'); }
    loadTabData(tab);
  }

  var tabDataLoaded = {};
  function loadTabData(tab) {
    if (tabDataLoaded[tab]) return;
    if (tab === 'posts') loadPosts();
    else if (tab === 'workouts') loadWorkouts();
    else if (tab === 'achievements') loadAchievements();
  }

  async function loadPosts() {
    try {
      var res = await fetch('/api/posts?user_id=' + targetUid + '&limit=20');
      var data = await res.json();
      var container = document.getElementById('posts-list');
      if (data.success && data.posts && data.posts.length > 0) {
        tabDataLoaded.posts = true;
        container.innerHTML = data.posts.map(function(post, idx) {
          var badgeHtml = '';
          if (post.workout_type) {
            var parts = [post.workout_type];
            if (post.calories_burned) parts.push(post.calories_burned + 'kcal');
            if (post.duration_minutes) parts.push(post.duration_minutes + '\u5206\u949F');
            badgeHtml = '<div class="post-workout-badge">' + getWorkoutTypeIcon(post.workout_type) + '<span>' + escapeHtml(parts.join(' ')) + '</span></div>';
          }
          return '<div class="post-card" style="animation:tabFadeIn .4s ' + (idx * .06) + 's both"><p class="post-text">' + escapeHtml(post.content) + '</p>' +
            (post.image_url ? '<img class="post-image" src="' + escapeHtml(post.image_url) + '" loading="lazy">' : '') + badgeHtml +
            '<div class="post-meta"><span class="post-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + formatTime(post.created_at) + '</span>' +
            '<button data-action="like" data-post-id="' + post.id + '" onclick="togglePostLike(this)" style="display:flex;align-items:center;gap:4px;background:none;border:none;font-size:13px;color:var(--sf-text-tertiary);cursor:pointer;padding:4px 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>' + (post.likes_count || '') + '</span></button>' +
            (post.comments_count > 0 ? '<span class="post-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> ' + post.comments_count + '</span>' : '') +
            '</div></div>';
        }).join('');
        restoreLikedState();
      } else {
        tabDataLoaded.posts = true;
        container.innerHTML = '<div class="empty-state"><div class="empty-state-title">\u6682\u65E0\u52A8\u6001</div><div class="empty-state-desc">\u8BE5\u7528\u6237\u8FD8\u6CA1\u6709\u53D1\u5E03\u52A8\u6001</div></div>';
      }
    } catch (e) { document.getElementById('posts-list').innerHTML = '<div class="empty-state"><div class="empty-state-title">\u52A0\u8F7D\u5931\u8D25</div></div>'; }
  }

  function togglePostLike(btn) {
    var postId = btn.getAttribute('data-post-id');
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    if (!user.id || !postId) { showToast('\u8BF7\u5148\u767B\u5F55', 'error'); return; }
    fetch('/api/posts/' + postId + '/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: user.id }) })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          var svg = btn.querySelector('svg path');
          var cs = btn.querySelector('span');
          var key = 'liked_posts_' + user.id;
          if (data.liked) {
            svg.setAttribute('fill', '#EF4444'); svg.setAttribute('stroke', '#EF4444'); btn.style.color = '#EF4444';
            var arr = JSON.parse(localStorage.getItem(key) || '[]');
            if (arr.indexOf(postId) === -1) { arr.push(postId); localStorage.setItem(key, JSON.stringify(arr)); }
          } else {
            svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); btn.style.color = 'var(--sf-text-tertiary)';
            var arr2 = JSON.parse(localStorage.getItem(key) || '[]').filter(function(id) { return id !== postId; });
            localStorage.setItem(key, JSON.stringify(arr2));
          }
          if (cs && data.likes_count !== undefined) cs.textContent = data.likes_count || '';
        }
      }).catch(function() {});
  }
  window.togglePostLike = togglePostLike;

  function restoreLikedState() {
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    if (!user.id) return;
    JSON.parse(localStorage.getItem('liked_posts_' + user.id) || '[]').forEach(function(pid) {
      var btn = document.querySelector('[data-post-id="' + pid + '"][data-action="like"]');
      if (btn) { var svg = btn.querySelector('svg path'); if (svg) { svg.setAttribute('fill', '#EF4444'); svg.setAttribute('stroke', '#EF4444'); btn.style.color = '#EF4444'; } }
    });
  }

  async function loadWorkouts() {
    try {
      var res = await fetch('/api/workouts/' + targetUid);
      var data = await res.json();
      var container = document.getElementById('workouts-list');
      if (data.success && data.workouts && data.workouts.length > 0) {
        tabDataLoaded.workouts = true;
        container.innerHTML = data.workouts.map(function(w, idx) {
          var sh = '';
          if (w.duration_minutes) sh += '<span class="workout-stat-chip">' + w.duration_minutes + '\u5206\u949F</span>';
          if (w.calories_burned) sh += '<span class="workout-stat-chip">' + w.calories_burned + 'kcal</span>';
          if (w.distance) sh += '<span class="workout-stat-chip">' + w.distance + 'km</span>';
          return '<div class="workout-card" style="animation:tabFadeIn .4s ' + (idx * .06) + 's both"><div class="workout-type-icon">' + getWorkoutTypeIcon(w.type || w.workout_type) + '</div><div class="workout-info"><div class="workout-type-name">' + escapeHtml(w.type || w.workout_type || '\u8FD0\u52A8') + '</div><div class="workout-date">' + formatTime(w.created_at || w.date || w.start_time) + '</div>' + (sh ? '<div class="workout-stats-inline">' + sh + '</div>' : '') + '</div></div>';
        }).join('');
      } else {
        tabDataLoaded.workouts = true;
        container.innerHTML = '<div class="empty-state"><div class="empty-state-title">\u6682\u65E0\u8FD0\u52A8\u8BB0\u5F55</div><div class="empty-state-desc">\u8BE5\u7528\u6237\u8FD8\u6CA1\u6709\u8FD0\u52A8\u8BB0\u5F55</div></div>';
      }
    } catch (e) { document.getElementById('workouts-list').innerHTML = '<div class="empty-state"><div class="empty-state-title">\u52A0\u8F7D\u5931\u8D25</div></div>'; }
  }

  async function loadAchievements() {
    try {
      var res = await fetch('/api/achievements/' + targetUid);
      var data = await res.json();
      var container = document.getElementById('achievements-list');
      var items = data.achievements || data.earned || [];
      if (data.success && items.length > 0) {
        tabDataLoaded.achievements = true;
        container.innerHTML = items.map(function(a, idx) {
          var aid = a.achievement_id || a.id || a.name || '';
          var aname = a.name || a.achievement_name || '\u6210\u5C31';
          var adesc = a.description || a.achievement_description || '';
          var adate = a.earned_at || a.unlocked_at || a.created_at || '';
          var gc = ACH_GRAD[aid] || ACH_GRAD[aname] || 'achievement-icon--green';
          var em = ACH_EMOJI[aid] || ACH_EMOJI[aname] || '\uD83C\uDFC6';
          return '<div class="achievement-card" style="animation:tabFadeIn .4s ' + (idx * .06) + 's both"><div class="achievement-icon ' + gc + '">' + em + '</div><div class="achievement-info"><div class="achievement-name">' + escapeHtml(aname) + '</div>' + (adesc ? '<div class="achievement-desc">' + escapeHtml(adesc) + '</div>' : '') + (adate ? '<div class="achievement-date">' + formatTime(adate) + ' \u83B7\u5F97</div>' : '') + '</div></div>';
        }).join('');
      } else {
        tabDataLoaded.achievements = true;
        container.innerHTML = '<div class="empty-state"><div class="empty-state-title">\u6682\u65E0\u6210\u5C31</div><div class="empty-state-desc">\u8BE5\u7528\u6237\u8FD8\u6CA1\u6709\u83B7\u5F97\u6210\u5C31</div></div>';
      }
    } catch (e) { document.getElementById('achievements-list').innerHTML = '<div class="empty-state"><div class="empty-state-title">\u52A0\u8F7D\u5931\u8D25</div></div>'; }
  }

  document.addEventListener('DOMContentLoaded', function() {
    targetUid = new URLSearchParams(window.location.search).get('uid');
    if (!targetUid) { showToast('\u7F3A\u5C11\u7528\u6237ID\u53C2\u6570', 'error'); return; }
    loadProfile();
    document.querySelectorAll('.profile-tab').forEach(function(tab) { tab.addEventListener('click', function() { switchTab(this.getAttribute('data-tab')); }); });
    document.getElementById('btn-follow').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); toggleFollow(); });
    document.getElementById('add-friend-btn').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); if (!currentUser) { showToast('\u8BF7\u5148\u767B\u5F55', 'error'); return; } sendFriendRequest(); });
    setTimeout(checkRelationStatus, 800);
    document.getElementById('btn-greet').addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      if (!currentUser) { showToast('\u8BF7\u5148\u767B\u5F55', 'error'); return; }
      var name = profileData ? (profileData.nickname || profileData.username || '') : '';
      navigateTo('chat.html?uid=' + encodeURIComponent(targetUid) + '&name=' + encodeURIComponent(name));
    });
  });

})();

/* ====== 单点登录：被踢下线检测 ====== */
(function() {
  function checkKicked() {
    var user = JSON.parse(localStorage.getItem('sportlife_user') || '{}');
    var sid = localStorage.getItem('sportlife_session_id') || '';
    if (!user.id || !sid) return;
    fetch('/api/session/kicked/' + user.id + '/' + sid).then(function(r){return r.json();}).then(function(data) {
      if (data.kicked) {
        localStorage.removeItem('sportlife_user');
        localStorage.removeItem('sportlife_session_id');
        // 显示被踢提示
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center';
        overlay.innerHTML = '<div style="background:white;border-radius:20px;padding:32px 24px;width:300px;max-width:85vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="10"/></svg></div>' +
          '<h3 style="font-size:17px;font-weight:600;color:#1E293B;margin:0 0 8px">账号已在其他设备登录</h3>' +
          '<p style="font-size:14px;color:#64748B;line-height:1.6;margin:0 0 24px">你的账号在其他设备上登录了，当前设备已下线。</p>' +
          '<button onclick="this.closest(\'div\').parentElement.remove();window.location.href=\'login.html\'" style="width:100%;padding:12px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,#22C55E,#16A34A);color:white;box-shadow:0 4px 12px rgba(34,197,94,0.3)">重新登录</button></div>';
        document.body.appendChild(overlay);
      }
    }).catch(function(){});
  }
  // 每 15 秒检测一次
  setTimeout(function() { checkKicked(); setInterval(checkKicked, 15000); }, 5000);
})();
