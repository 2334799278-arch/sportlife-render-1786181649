(function() {
  'use strict';

  /* ===== Auth ===== */
  var user = getCurrentUser();
  if (!user) {
    navigateTo('login.html');
    return;
  }

  /* ===== State ===== */
  var currentTab = 'recommend';
  var posts = [];
  var likedPosts = new Set();
  var commentTargetPostId = null;
  var autoRefreshTimer = null;

  /* ===== Utility: format time ===== */
  function formatTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    var month = d.getMonth() + 1;
    var day = d.getDate();
    if (d.getFullYear() === now.getFullYear()) {
      return month + '月' + day + '日';
    }
    return d.getFullYear() + '年' + month + '月' + day + '日';
  }

  /* ===== Utility: escape HTML ===== */
  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

  /* ===== Utility: toast ===== */
  function showToast(msg, type) {
    document.querySelectorAll('.toast-msg').forEach(function(t) { t.remove(); });
    var t = document.createElement('div');
    t.className = 'toast-msg';
    t.style.background = (type === 'success') ? 'var(--sf-primary)' :
                         (type === 'error' ? 'var(--sf-error)' : 'var(--sf-text-secondary)');
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { t.classList.add('show'); });
    });
    setTimeout(function() {
      t.classList.remove('show');
      setTimeout(function() { t.remove(); }, 300);
    }, 2500);
  }

  /* ===== Workout type icon map ===== */
  function getWorkoutTypeIcon(type) {
    var icons = {
      '跑步': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M13.5 5.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.1 7.1 0 0 0 21 13.2V11.1a5.1 5.1 0 0 1-4.5-2.8l-1-1.6a2 2 0 0 0-1.7-1 2 2 0 0 0-.9.2L7 8.3V13h2V9.6l1.8-.7"/></svg>',
      'HIIT': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
      '瑜伽': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><circle cx="12" cy="4" r="2"/><path d="M12 6v6l-4 8h2l2-4 2 4h2l-4-8V6z"/></svg>',
      '力量训练': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M6.5 6.5h11M5 8h2m10 0h2M7 14h10M5 12h2m10 0h2M5 10v4M19 10v4M3 8h2v8H3zM19 8h2v8h-2z"/></svg>',
      '游泳': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M2 20c2-1 4-1 6 0s4 1 6 0 4-1 6 0"/><path d="M2 16c2-1 4-1 6 0s4 1 6 0 4-1 6 0"/><circle cx="12" cy="8" r="3"/><path d="M12 11v3"/></svg>',
      '骑行': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6l-4 6h4l-3 5.5M5.5 17.5L10 8l3 2.5"/></svg>',
      '拉伸': '<svg class="workout-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="var(--sf-primary)" stroke="none"><path d="M6 4l12 8-12 8V4z"/></svg>'
    };
    return icons[type] || icons['HIIT'];
  }

  /* ===== Load Feed ===== */
  async function loadFeed(showPullRefresh) {
    if (showPullRefresh) {
      var indicator = document.getElementById('pull-indicator');
      indicator.classList.add('visible');
    }
    try {
      if (currentTab === 'following') {
        /* Following tab: directly show empty state */
        var loadingEl = document.getElementById('feed-loading');
        if (loadingEl) loadingEl.style.display = 'none';
        posts = [];
        likedPosts.clear();
        renderEmpty();
        return;
      }
      var url = '/api/feed';
      var res = await fetch(url);
      var data = await res.json();
      var loadingEl = document.getElementById('feed-loading');
      if (loadingEl) loadingEl.style.display = 'none';
      if (data.success) {
        posts = data.feed || data.posts || [];
        likedPosts.clear();
        posts.forEach(function(p) {
          if (p.is_liked) likedPosts.add(p.id);
        });
        renderPosts();
      } else {
        renderEmpty();
      }
    } catch (e) {
      var loadingEl = document.getElementById('feed-loading');
      if (loadingEl) loadingEl.style.display = 'none';
      renderEmpty();
    } finally {
      if (showPullRefresh) {
        setTimeout(function() {
          document.getElementById('pull-indicator').classList.remove('visible');
        }, 400);
      }
    }
  }

  /* ===== Render Posts ===== */
  function renderPosts() {
    var feed = document.getElementById('post-feed');
    if (!posts || posts.length === 0) {
      renderEmpty();
      return;
    }
    feed.innerHTML = posts.map(function(post, index) {
      var postUser = post.author || post.user || {};
      var initial = (postUser.nickname || postUser.username || 'U').charAt(0);
      var name = postUser.nickname || postUser.username || '用户';
      var avatarColor = postUser.avatar_color || '#DCFCE7';
      var avatarTextColor = postUser.avatar_text_color || '#22C55E';
      var isLiked = likedPosts.has(post.id);

      /* Workout badge */
      var badgeHtml = '';
      if (post.workout_type) {
        var parts = [post.workout_type];
        if (post.calories_burned) parts.push(post.calories_burned + 'kcal');
        if (post.duration_minutes) parts.push(post.duration_minutes + '分钟');
        badgeHtml = '<div class="workout-badge">' + getWorkoutTypeIcon(post.workout_type) +
                    '<span>' + escapeHtml(parts.join(' ')) + '</span></div>';
      }

      return '<div class="feed-card" style="animation-delay:' + (index * 0.06) + 's">' +
        /* Author */
        '<div class="card-author" data-user-id="' + (postUser.id || '') + '">' +
          '<a href="user-profile.html?uid=' + (postUser.id || '') + '" style="text-decoration:none;">' +
            '<div class="author-avatar" style="background:' + escapeHtml(avatarColor) + ';color:' + escapeHtml(avatarTextColor) + '">' + escapeHtml(initial) + '</div>' +
          '</a>' +
          '<div class="author-info">' +
            '<a href="user-profile.html?uid=' + (postUser.id || '') + '" style="text-decoration:none;color:var(--sf-text-primary);">' + escapeHtml(name) + '</a>' +
            '<div class="author-time">' + formatTime(post.created_at) + '</div>' +
          '</div>' +
        '</div>' +
        /* Text */
        '<p class="card-text">' + escapeHtml(post.content) + '</p>' +
        /* Image */
        (post.image_url ? '<img class="card-image" src="' + escapeHtml(post.image_url) + '" loading="lazy" alt="post image">' : '') +
        /* Badge */
        badgeHtml +
        /* Action bar */
        '<div class="action-bar">' +
          /* Like button */
          '<button class="action-btn like-btn' + (isLiked ? ' is-liked' : '') + '" data-action="like" data-post-id="' + post.id + '" style="' + (isLiked ? 'color:#EF4444;' : '') + '">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="' + (isLiked ? '#EF4444' : 'none') + '" stroke="' + (isLiked ? '#EF4444' : 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
            '</svg>' +
            '<span>' + (post.likes_count > 0 ? post.likes_count : '') + '</span>' +
          '</button>' +
          /* Comment button */
          '<button class="action-btn" data-action="comment" data-post-id="' + post.id + '">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
            '</svg>' +
            '<span>' + (post.comments_count > 0 ? post.comments_count : '') + '</span>' +
          '</button>' +
          /* Share button */
          '<button class="action-btn action-share" data-action="share" data-post-id="' + post.id + '">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>' +
              '<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>' +
            '</svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ===== Render Empty State ===== */
  function renderEmpty() {
    var feed = document.getElementById('post-feed');
    var msg = currentTab === 'following' ?
      { title: '还没有关注的人', desc: '关注你感兴趣的用户，查看他们的动态' } :
      { title: '暂无动态', desc: '来发布第一条吧！' };
    feed.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state-icon">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
          '<circle cx="9" cy="7" r="4"/>' +
          '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>' +
          '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>' +
        '</svg>' +
      '</div>' +
      '<div class="empty-state-title">' + msg.title + '</div>' +
      '<div class="empty-state-desc">' + msg.desc + '</div>' +
    '</div>';
  }

  /* ===== Toggle Like ===== */
  async function toggleLike(postId) {
    var btn = document.querySelector('.like-btn[data-post-id="' + postId + '"]');
    if (!btn) return;

    /* Optimistic UI update */
    var isLiked = likedPosts.has(postId);
    if (isLiked) {
      likedPosts.delete(postId);
      btn.classList.remove('is-liked');
      btn.style.color = 'var(--sf-text-tertiary)';
      btn.querySelector('svg').setAttribute('fill', 'none');
      btn.querySelector('svg').setAttribute('stroke', 'currentColor');
    } else {
      likedPosts.add(postId);
      btn.classList.add('is-liked');
      btn.style.color = '#EF4444';
      btn.querySelector('svg').setAttribute('fill', '#EF4444');
      btn.querySelector('svg').setAttribute('stroke', '#EF4444');
      /* Heart burst animation */
      btn.classList.remove('like-animating');
      void btn.offsetWidth;
      btn.classList.add('like-animating');
      setTimeout(function() { btn.classList.remove('like-animating'); }, 400);
    }

    /* Optimistic count display */
    var countSpan = btn.querySelector('span');
    var post = posts.find(function(p) { return p.id === postId; });
    if (post) {
      if (isLiked) {
        post.likes_count = Math.max(0, (post.likes_count || 1) - 1);
        post.is_liked = false;
      } else {
        post.likes_count = (post.likes_count || 0) + 1;
        post.is_liked = true;
      }
      countSpan.textContent = post.likes_count > 0 ? post.likes_count : '';
    }

    /* Send to server */
    try {
      var res = await fetch('/api/posts/' + postId + '/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user.id })
      });
      var data = await res.json();
      if (data.success) {
        /* Confirmed: update with server count */
        if (data.likes_count !== undefined && post) {
          post.likes_count = data.likes_count;
          countSpan.textContent = post.likes_count > 0 ? post.likes_count : '';
        }
        if (data.liked) { likedPosts.add(postId); }
        else { likedPosts.delete(postId); }
      } else {
        /* Rollback on failure */
        if (isLiked) {
          likedPosts.add(postId);
          btn.classList.add('is-liked');
          btn.style.color = '#EF4444';
          btn.querySelector('svg').setAttribute('fill', '#EF4444');
          btn.querySelector('svg').setAttribute('stroke', '#EF4444');
        } else {
          likedPosts.delete(postId);
          btn.classList.remove('is-liked');
          btn.style.color = 'var(--sf-text-tertiary)';
          btn.querySelector('svg').setAttribute('fill', 'none');
          btn.querySelector('svg').setAttribute('stroke', 'currentColor');
        }
        if (post) {
          post.likes_count = isLiked ? (post.likes_count || 0) + 1 : Math.max(0, (post.likes_count || 1) - 1);
          post.is_liked = isLiked;
          countSpan.textContent = post.likes_count > 0 ? post.likes_count : '';
        }
      }
    } catch (e) {
      /* Network error - silent rollback handled by optimistic state */
    }
  }

  /* ===== Focus Comment ===== */
  function focusComment(postId) {
    commentTargetPostId = postId;
    var post = posts.find(function(p) { return p.id === postId; });
    var postUser = post ? (post.author || post.user || {}) : {};
    var name = postUser.nickname || postUser.username || '用户';
    var target = document.getElementById('comment-target');
    var targetText = document.getElementById('comment-target-text');
    targetText.textContent = '回复 ' + name;
    target.classList.add('visible');
    var input = document.getElementById('comment-input');
    input.placeholder = '回复 ' + name + '...';
    input.focus();
  }

  /* ===== Submit Comment ===== */
  async function submitComment() {
    var input = document.getElementById('comment-input');
    var content = input.value.trim();
    if (!content || !commentTargetPostId) return;
    var sendBtn = document.getElementById('comment-send-btn');
    sendBtn.disabled = true;
    try {
      var res = await fetch('/api/posts/' + commentTargetPostId + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user.id, content: content })
      });
      var data = await res.json();
      if (data.success) {
        input.value = '';
        sendBtn.disabled = true;
        /* Update comment count */
        var post = posts.find(function(p) { return p.id === commentTargetPostId; });
        if (post) { post.comments_count = (post.comments_count || 0) + 1; }
        clearCommentTarget();
        renderPosts();
        showToast('评论成功', 'success');
      } else {
        showToast('评论失败，请重试', 'error');
      }
    } catch (e) {
      showToast('网络错误，请重试', 'error');
      sendBtn.disabled = false;
    }
  }

  /* ===== Clear Comment Target ===== */
  function clearCommentTarget() {
    commentTargetPostId = null;
    var target = document.getElementById('comment-target');
    target.classList.remove('visible');
    var input = document.getElementById('comment-input');
    input.placeholder = '写评论...';
    input.value = '';
    document.getElementById('comment-send-btn').disabled = true;
  }

  /* ===== Share Post ===== */
  function sharePost(postId) {
    if (navigator.share) {
      navigator.share({ title: 'SportLife动态', text: '来看看这条运动动态！', url: window.location.href });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(window.location.href).then(function() {
        showToast('链接已复制到剪贴板', 'success');
      }).catch(function() {
        showToast('链接已复制', 'success');
      });
    } else {
      showToast('分享功能暂不可用');
    }
  }

  /* ===== Switch Tab ===== */
  function switchTab(tab) {
    if (tab === currentTab) return;
    currentTab = tab;

    /* Update tab UI */
    document.querySelectorAll('.sub-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === tab);
    });

    /* Reset state */
    clearCommentTarget();
    likedPosts.clear();

    /* Show loading */
    document.getElementById('post-feed').innerHTML = '';
    document.getElementById('feed-loading').style.display = 'block';

    /* Load feed for new tab */
    loadFeed(false);
  }

  /* ===== Pull To Refresh ===== */
  var touchStartY = 0;
  var isPulling = false;

  function initPullToRefresh() {
    var feedArea = document.querySelector('main');
    feedArea.addEventListener('touchstart', function(e) {
      if (window.scrollY <= 0) {
        touchStartY = e.touches[0].clientY;
        isPulling = true;
      }
    }, { passive: true });
    feedArea.addEventListener('touchmove', function(e) {
      if (!isPulling) return;
      var diff = e.touches[0].clientY - touchStartY;
      if (diff > 60 && window.scrollY <= 0) {
        document.getElementById('pull-indicator').classList.add('visible');
      }
    }, { passive: true });
    feedArea.addEventListener('touchend', function() {
      if (isPulling && document.getElementById('pull-indicator').classList.contains('visible')) {
        loadFeed(true);
      }
      isPulling = false;
    }, { passive: true });
  }

  /* ===== Auto Refresh ===== */
  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(function() {
      loadFeed(false);
    }, 30000);
  }

  /* ===== Init ===== */
  function init() {
    /* Load initial feed */
    loadFeed(false);

    /* Start auto-refresh */
    startAutoRefresh();

    /* Init pull to refresh */
    initPullToRefresh();

    /* Tab switching */
    document.querySelectorAll('.sub-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        switchTab(this.getAttribute('data-tab'));
      });
    });

    /* Comment input: enable/disable send button */
    var commentInput = document.getElementById('comment-input');
    var commentSendBtn = document.getElementById('comment-send-btn');
    commentInput.addEventListener('input', function() {
      commentSendBtn.disabled = !this.value.trim();
    });

    /* Send button click */
    commentSendBtn.addEventListener('click', function() {
      submitComment();
    });

    /* Enter key to submit comment */
    commentInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!commentSendBtn.disabled) submitComment();
      }
    });

    /* Comment target close */
    document.getElementById('comment-target-close').addEventListener('click', function() {
      clearCommentTarget();
    });

    /* Event delegation for feed actions (like, comment, share) */
    var feed = document.getElementById('post-feed');
    feed.addEventListener('click', function(e) {
      var btn = e.target.closest('button[data-action]');
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        var action = btn.getAttribute('data-action');
        var postId = btn.getAttribute('data-post-id');
        if (action === 'like') toggleLike(postId);
        else if (action === 'comment') focusComment(postId);
        else if (action === 'share') sharePost(postId);
      }
    }, true);

    /* Visibility change: pause/resume auto-refresh */
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      } else {
        startAutoRefresh();
        loadFeed(false);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', init);

})();
